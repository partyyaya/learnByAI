# 對應章節：Chapter 05（toolchain）、Chapter 06（AES-CTR 解密）、Chapter 08（capstone）
[package]
name = "img-crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
aes = "0.8"
ctr = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
