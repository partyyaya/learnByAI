<!-- 對應章節：Chapter 03 - 只加密前 N byte（AES-CTR）+ WebCrypto 解密 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Ch03 · 檔頭 AES-CTR Demo</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 760px; margin: 1em auto; padding: 0 1em; }
    img { max-width: 100%; border: 1px solid #ccc; margin: .5em 0; display: block; }
    section { margin-bottom: 2em; }
    .stat { font-family: monospace; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>
  <h1>Ch03 · 檔頭 AES-CTR Demo（WebCrypto 版）</h1>
  <p>後端只加密前 1024 byte。前端用 <code>crypto.subtle.decrypt</code> 解前 N byte，後面 99% byte 不動。</p>

  <section>
    <h2>1. 上傳</h2>
    <input type="file" id="upload" accept="image/*">
    <div id="uploadResult" class="stat"></div>
  </section>

  <section>
    <h2>2. 瀏覽器直接載入密文（破圖）</h2>
    <img id="rawImg" alt="raw">
  </section>

  <section>
    <h2>3. WebCrypto 解密後</h2>
    <img id="decImg" alt="dec">
    <div id="benchResult" class="stat"></div>
  </section>

  <script>
    document.getElementById('upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fd = new FormData();
      fd.append('image', file);
      const { id } = await fetch('/api/upload', { method: 'POST', body: fd })
        .then((r) => r.json());

      uploadResult.textContent = `已上傳，id=${id}`;
      rawImg.src = `/api/image/${id}.enc`;

      const [meta, encBuf] = await Promise.all([
        fetch(`/api/image/${id}/key`).then((r) => r.json()),
        fetch(`/api/image/${id}.enc`).then((r) => r.arrayBuffer()),
      ]);

      const t0 = performance.now();
      const decBuf = await decryptHeader(encBuf, meta);
      const t1 = performance.now();

      benchResult.textContent =
        `${(decBuf.length / 1024 / 1024).toFixed(2)} MB · 只解前 ${meta.headerLen} byte 耗時 ${(t1 - t0).toFixed(2)} ms`;

      const blob = new Blob([decBuf], { type: meta.mime });
      const url = URL.createObjectURL(blob);
      decImg.src = url;
      decImg.onload = () => URL.revokeObjectURL(url);
    });

    async function decryptHeader(encBuf, meta) {
      const key = await crypto.subtle.importKey(
        'raw',
        hexToBytes(meta.keyHex),
        { name: 'AES-CTR', length: 256 },
        false,
        ['decrypt']
      );

      const fullEnc = new Uint8Array(encBuf);
      const headerEnc = fullEnc.subarray(0, meta.headerLen);
      const tail = fullEnc.subarray(meta.headerLen);

      const headerPlain = new Uint8Array(await crypto.subtle.decrypt(
        { name: 'AES-CTR', counter: hexToBytes(meta.ivHex), length: 64 },
        key,
        headerEnc,
      ));

      const out = new Uint8Array(fullEnc.length);
      out.set(headerPlain, 0);
      out.set(tail, meta.headerLen);
      return out;
    }

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }
  </script>
</body>
</html>
