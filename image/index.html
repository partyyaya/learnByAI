<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二次元黑貓數字 0-9</title>
<style>
 body{margin:0;font-family:'PingFang TC',sans-serif;background:#2b2733;color:#f4ecda}
 h1{text-align:center;padding:24px 0 6px;margin:0;font-weight:800}
 p.sub{text-align:center;margin:0 0 24px;color:#c9b48f}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:0 24px 40px;max-width:1000px;margin:0 auto}
 figure{margin:0;background:#3a3446;border-radius:16px;padding:10px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
 .thumb{border-radius:10px;overflow:hidden;background:
   linear-gradient(45deg,#cfc9d8 25%,transparent 25%),linear-gradient(-45deg,#cfc9d8 25%,transparent 25%),
   linear-gradient(45deg,transparent 75%,#cfc9d8 75%),linear-gradient(-45deg,transparent 75%,#cfc9d8 75%);
   background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;background-color:#fff}
 img{width:100%;height:auto;display:block}
 figcaption{margin-top:6px;font-size:20px;font-weight:700;color:#ffd24a}
 figcaption small{font-size:12px;color:#c9b48f;font-weight:400}
</style></head><body>
 <h1>🐱 二次元黑貓數字 0-9</h1>
 <p class="sub">Q 版大頭黑貓彎成數字 · 個別 SVG 皆為透明背景</p>
 <div class="grid">
      <figure><div class="thumb"><img src="cat-0.svg" alt="貓咪數字 0"></div><figcaption>0 <small>· 1 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-1.svg" alt="貓咪數字 1"></div><figcaption>1 <small>· 1 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-2.svg" alt="貓咪數字 2"></div><figcaption>2 <small>· 1 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-3.svg" alt="貓咪數字 3"></div><figcaption>3 <small>· 2 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-4.svg" alt="貓咪數字 4"></div><figcaption>4 <small>· 2 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-5.svg" alt="貓咪數字 5"></div><figcaption>5 <small>· 2 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-6.svg" alt="貓咪數字 6"></div><figcaption>6 <small>· 1 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-7.svg" alt="貓咪數字 7"></div><figcaption>7 <small>· 1 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-8.svg" alt="貓咪數字 8"></div><figcaption>8 <small>· 2 隻貓</small></figcaption></figure>
      <figure><div class="thumb"><img src="cat-9.svg" alt="貓咪數字 9"></div><figcaption>9 <small>· 1 隻貓</small></figcaption></figure>
 </div>
</body></html>
