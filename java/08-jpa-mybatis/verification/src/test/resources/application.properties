spring.datasource.url=${MYSQL_TEST_URL}
spring.datasource.username=root
spring.datasource.password=review-only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:probe-schema.sql
mybatis.mapper-locations=classpath:*Mapper.xml
mybatis.type-handlers-package=com.example.lab.mybatis
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.root=WARN
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
