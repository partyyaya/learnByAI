<svg xmlns="http://www.w3.org/2000/svg" width="960" height="531" viewBox="0 0 960 531" role="img" aria-labelledby="title desc"><title id="title">圖 16｜畫面先連續轉動，模型在完成時一次提交</title><desc id="desc">以預設 340ms 為例：完成回呼安排於 duration + 32ms；實際排程可能延後。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="529" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 16｜畫面先連續轉動，模型在完成時一次提交</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">以預設 340ms 為例：完成回呼安排於 duration + 32ms；實際排程可能延後。</text><text x="190" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#24352f" font-weight="400" text-anchor="start">0ms</text><text x="738" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#24352f" font-weight="400" text-anchor="start">340ms</text><text x="844" y="131" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#24352f" font-weight="400" text-anchor="start">372ms</text><path d="M210 151L210 426" stroke="#65766e" stroke-width="1" fill="none" stroke-dasharray="6 6"/><path d="M760 151L760 426" stroke="#65766e" stroke-width="1" fill="none" stroke-dasharray="6 6"/><path d="M885 151L885 426" stroke="#65766e" stroke-width="1" fill="none" stroke-dasharray="6 6"/><text x="40" y="219" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#25856c" font-weight="600" text-anchor="start">CSS 小塊</text><rect x="210" y="190" width="550" height="49" rx="6" fill="#25856c15" stroke="#25856c"/><text x="230" y="221" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#25856c" font-weight="600" text-anchor="start">連續插值：0° → 90°</text><text x="40" y="299" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#397cb4" font-weight="600" text-anchor="start">模型資料</text><rect x="210" y="270" width="675" height="49" rx="6" fill="#397cb415" stroke="#397cb4"/><text x="230" y="301" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#397cb4" font-weight="600" text-anchor="start">先保留上一步的整數 p、O</text><text x="40" y="379" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#c45f43" font-weight="600" text-anchor="start">光照更新</text><rect x="210" y="350" width="675" height="49" rx="6" fill="#c45f4315" stroke="#c45f43"/><text x="230" y="381" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#c45f43" font-weight="600" text-anchor="start">rAF + 同一條貝茲曲線</text><rect x="760" y="190" width="125" height="49" rx="6" fill="#e8eee7" stroke="#dbe4dc"/><text x="822" y="219" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="middle">保持終點</text><text x="480" y="462" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">finishMove：提交 Q × p、Q × O，再啟動下一步</text><text x="480" y="502" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif