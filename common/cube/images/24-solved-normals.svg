<svg xmlns="http://www.w3.org/2000/svg" width="960" height="554" viewBox="0 0 960 554" role="img" aria-labelledby="title desc"><title id="title">圖 24｜復原看貼紙朝向，不要求中心塊完全沒轉過</title><desc id="desc">九格只畫其中一面示意；實際 isSolved 會逐一檢查六面的所有貼紙。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="552" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 24｜復原看貼紙朝向，不要求中心塊完全沒轉過</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">九格只畫其中一面示意；實際 isSolved 會逐一檢查六面的所有貼紙。</text><rect x="25" y="105" width="290" height="338" rx="12" fill="white" stroke="#dbe4dc"/><text x="170" y="142" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="middle">所有貼紙回到原面</text><rect x="101" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="149" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="197" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="101" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="149" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="197" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="101" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="149" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="197" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><text x="170" y="368" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">通過</text><text x="170" y="406" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="middle">每張貼紙的方向都一致</text><rect x="335" y="105" width="290" height="338" rx="12" fill="white" stroke="#dbe4dc"/><text x="480" y="142" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="middle">一張貼紙還在錯面</text><rect x="411" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="459" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="507" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="411" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="459" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="507" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="411" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="459" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="507" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="411" y="177" width="44" height="44" rx="4" fill="#fffef5" stroke="#dbe4dc"/><text x="480" y="368" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#c45f43" font-weight="600" text-anchor="middle">不通過</text><text x="480" y="406" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="middle">至少一張法線不一致</text><rect x="645" y="105" width="290" height="338" rx="12" fill="white" stroke="#dbe4dc"/><text x="790" y="142" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="middle">中心自轉，顏色不變</text><rect x="721" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="769" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="817" y="177" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="721" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="769" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="817" y="225" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="721" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="769" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="817" y="273" width="44" height="44" rx="4" fill="#369477" stroke="#dbe4dc"/><text x="790" y="258" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="29" fill="#e3f5e8" font-weight="600" text-anchor="middle">↻</text><text x="790" y="368" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">通過</text><text x="790" y="406" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="middle">每張貼紙的方向都一致</text><text x="480" y="488" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="middle">合法的外層轉動模型中，比較 54 張貼紙的世界法線。</text><text x="480" y="526" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="middle">中心軸向自轉不改變該面法線，因此不要求所有 O 都等於單位矩陣。</text></svg>