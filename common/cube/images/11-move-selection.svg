<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" role="img" aria-labelledby="title desc"><title id="title">圖 11｜一個 Move 指令，決定選哪層、往哪轉</title><desc id="desc">以 F 面為例：固定 z = 1，x 與 y 各有三種值，所以恰好選中九塊。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="546" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 11｜一個 Move 指令，決定選哪層、往哪轉</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">以 F 面為例：固定 z = 1，x 與 y 各有三種值，所以恰好選中九塊。</text><rect x="25" y="105" width="205" height="122" rx="12" fill="white" stroke="#dbe4dc"/><text x="43" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">face = F</text><text x="43" y="172" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">選擇前面</text><rect x="260" y="105" width="205" height="122" rx="12" fill="white" stroke="#dbe4dc"/><text x="278" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#397cb4" font-weight="600" text-anchor="start">axis = 2</text><text x="278" y="172" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">檢查 position[2]</text><rect x="495" y="105" width="205" height="122" rx="12" fill="white" stroke="#dbe4dc"/><text x="513" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">layer = 1</text><text x="513" y="172" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">只選 z = 1</text><rect x="730" y="105" width="205" height="122" rx="12" fill="white" stroke="#dbe4dc"/><text x="748" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">sign = −1</text><text x="748" y="172" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">數學 Z 軸轉 −90°</text><text x="170" y="273" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#65766e" font-weight="600" text-anchor="middle">z = -1</text><rect x="110" y="298" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="154" y="298" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="198" y="298" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="110" y="342" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="154" y="342" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="198" y="342" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="110" y="386" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="154" y="386" width="40" height="40" rx="4" fill="#dce6dd" stroke="#dbe4dc"/><rect x="198" y="386" width="40" height="40" rx="4" fill="#d