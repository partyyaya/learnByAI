0" height="40" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="764" y="386" width="40" height="40" rx="4" fill="#369477" stroke="#dbe4dc"/><rect x="808" y="386" width="40" height="40" rx="4" fill="#369477" stroke="#dbe4dc"/><text x="780" y="463" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#25856c" font-weight="600" text-anchor="middle">選中九塊</text><text x="480" y="520" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="middle">belongsToLayer：position[move.axis] === move.layer</text></svg>