<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="title desc"><title id="title">圖 6｜27 個小塊，為什麼只有 54 張貼紙？</title><desc id="desc">計數時分開看「塊體」與「有顏色的外部貼紙」。黑面仍有實體面板。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="542" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 6｜27 個小塊，為什麼只有 54 張貼紙？</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">計數時分開看「塊體」與「有顏色的外部貼紙」。黑面仍有實體面板。</text><rect x="30" y="110" width="195" height="278" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="141" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">角塊</text><g transform="translate(76 164) scale(1)"><path d="M0 24L60 44L60 108L0 88Z" fill="#369477" stroke="#24352f"/><path d="M60 44L102 16L102 80L60 108Z" fill="#da5949" stroke="#24352f"/><path d="M0 24L42 0L102 16L60 44Z" fill="#fffef5" stroke="#24352f"/></g><text x="127" y="309" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="60