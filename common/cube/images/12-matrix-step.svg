<svg xmlns="http://www.w3.org/2000/svg" width="960" height="588" viewBox="0 0 960 588" role="img" aria-labelledby="title desc"><title id="title">圖 12｜同一個 Q，同時旋轉位置與朝向</title><desc id="desc">例子是 F 順時針：中心 [1,1,1] 變成 [1,−1,1]。矩陣一列對應一個輸出分量。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="586" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 12｜同一個 Q，同時旋轉位置與朝向</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">例子是 F 順時針：中心 [1,1,1] 變成 [1,−1,1]。矩陣一列對應一個輸出分量。</text><text x="88" y="142" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">本次旋轉 Q</text><text x="403" y="142" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">原位置 p</text><text x="735" y="142" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">新位置 p′</text><text x="105" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#397cb4" font-weight="600" text-anchor="middle">0</text><text x="174" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#397cb4" font-weight="600" text-anchor="middle">1</text><text x="243" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#397cb4" font-weight="600" text-anchor="middle">0</text><text x="105" y="257" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">-1</text><text x="174" y="257" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">0</text><text x="243" y="257" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">0</text><text x="105" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">0</text><text x="174" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">0</text><text x="243" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">1</text><text x="450" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">1</text><text x="450" y="257" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">1</text><text x="450" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#24352f" font-weight="600" text-anchor="middle">1</text><text x="793" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#25856c" font-weight="600" text-anchor="middle">1</text><text x="793" y="257" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#25856c" font-weight="600" text-anchor="middle">-1</text><text x="793" y="312" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" fill="#25856c" font-weight="600" text-anchor="middle">1</text><text x="320" y="258" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="35" fill="#65766e" font-weight="600" text-anchor="middle">×</text><text x="612" y="258" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="35" fill="#65766e" font-weight="600" text-anchor="middle">=</text><rect x="40" y="350" width="880" height="65" rx="8" fill="#eaf2f9" stroke="#dbe4dc"/><text x="480" y="390" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#397cb4" font-weight="600" text-anchor="middle">第一列：0 × x + 1 × y + 0 × z = y = 1</text><rect x="40" y="445" width="410" height="115" rx="12" fill="white" stroke="#dbe4dc"/><text x="58" y="476" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">更新中心位置</text><text x="58" y="512" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">p′ = Q × p</text><rect x="510" y="445" width="410" height="115" rx="12" fill="white" stroke="#dbe4dc"/><text x="528" y="476" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">更新三支局部軸的方向</text><text x="528" y="512" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">O′ = Q × O（對舊 O 的每欄作用）</text></svg>