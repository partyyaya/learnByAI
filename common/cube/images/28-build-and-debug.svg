<svg xmlns="http://www.w3.org/2000/svg" width="960" height="573" viewBox="0 0 960 573" role="img" aria-labelledby="title desc"><title id="title">圖 28｜先分段完成，再依問題回到對應層排查</title><desc id="desc">每完成一段先驗證，再加入下一段，能縮小出錯時需要追蹤的範圍。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="571" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 28｜先分段完成，再依問題回到對應層排查</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">每完成一段先驗證，再加入下一段，能縮小出錯時需要追蹤的範圍。</text><rect x="25" y="108" width="170" height="108" rx="7" fill="#edf5ed" stroke="#dbe4dc"/><text x="110" y="144" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">畫得出</text><text x="110" y="183" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="middle">六面小塊 → 27 塊</text><path d="M198 163L207 163" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="210" y="108" width="170" height="108" rx="7" fill="#edf5ed" stroke="#dbe4dc"/><text x="295" y="144" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">算得對</text><text x="295" y="183" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="middle">座標與朝向矩陣</text><path d="M383 163L392 163" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="395" y="108" width="170" height="108" rx="7" fill="#edf5ed" stroke="#dbe4dc"/><text x="480" y="144" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">動得順</text><text x="480" y="183" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="middle">共同軸與過渡曲線</text><path d="M568 163L577 163" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="580" y="108" width="170" height="108" rx="7" fill="#edf5ed" stroke="#dbe4dc"/><text x="665" y="144" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">不誤觸</text><text x="665" y="183" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="middle">拖曳、點擊與排隊</text><path d="M753 163L762 163" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="765" y="108" width="170" height="108" rx="7" fill="#edf5ed" stroke="#dbe4dc"/><text x="850" y="144" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">能恢復</text><text x="850" y="183" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="middle">epoch 與資源清理</text><rect x="28" y="258" width="904" height="57" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="294" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#c45f43" font-weight="600" text-anchor="start">顏色方向顛倒</text><text x="331" y="294" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#65766e" font-weight="400" text-anchor="start">→</text><text x="375" y="294" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="400" text-anchor="start">查座標：S × p、S × O × S、Q × O</text><rect x="28" y="330" width="904" height="57" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="366" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#c45f43" font-weight="600" text-anchor="start">小塊移動或自轉不對</text><text x="331" y="366" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#65766e" font-weight="400" text-anchor="start">→</text><text x="375" y="366" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="400" text-anchor="start">查變換順序：外層 rotate3d × 原始矩陣</text><rect x="28" y="402" width="904" height="57" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="438" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#c45f43" font-weight="600" text-anchor="start">慢拖卻轉層</text><text x="331" y="438" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#65766e" font-weight="400" text-anchor="start">→</text><text x="375" y="438" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="400" text-anchor="start">查手勢：相對按下點的距離 + 拖曳鎖定</text><rect x="28" y="474" width="904" height="57" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="510" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#c45f43" font-weight="600" text-anchor="start">復原後又跳動</text><text x="331" y="510" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#65766e" font-weight="400" text-anchor="start">→</text><text x="375" y="510" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="400" text-anchor="start">查清理：timer、rAF、queue、epoch</text></svg>