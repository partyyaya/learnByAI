<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">圖 22｜打亂也是一串普通 Move 指令</title><desc id="desc">相鄰步驟換軸，減少立即抵消；這不是均勻抽樣全部魔方狀態。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="538" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 22｜打亂也是一串普通 Move 指令</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">相鄰步驟換軸，減少立即抵消；這不是均勻抽樣全部魔方狀態。</text><text x="40" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">範例：20 步，每步都走同一條執行隊列</text><rect x="35" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="72.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">U</text><rect x="125" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="162.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">F′</text><rect x="215" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="252.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">R</text><rect x="305" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="342.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">B</text><rect x="395" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="432.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">D′</text><rect x="485" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="522.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">L</text><rect x="575" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="612.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">F</text><rect x="665" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="702.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">U′</text><rect x="755" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="792.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">R</text><rect x="845" y="163" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="882.5" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">D</text><rect x="35" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="72.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">F′</text><rect x="125" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="162.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">L</text><rect x="215" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="252.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">U</text><rect x="305" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="342.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">B′</text><rect x="395" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="432.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">R</text><rect x="485" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="522.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">F</text><rect x="575" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="612.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">D</text><rect x="665" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="702.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">L′</text><rect x="755" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="792.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">B</text><rect x="845" y="224" width="75" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="882.5" y="249" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">U</text><rect x="30" y="313" width="900" height="198" rx="12" fill="white" stroke="#dbe4dc"/><text x="52" y="350" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="22" fill="#24352f" font-weight="600" text-anchor="start">若上一面是 U（Y 軸），下一步如何選？</text><rect x="75" y="378" width="95" height="38" rx="5" fill="#65766e13" stroke="#65766e"/><text x="122.5" y="403" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#65766e" font-weight="600" text-anchor="middle">U</text><rect x="213" y="378" width="95" height="38" rx="5" fill="#65766e13" stroke="#65766e"/><text x="260.5" y="403" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#65766e" font-weight="600" text-anchor="middle">D</text><rect x="351" y="378" width="95" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="398.5" y="403" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">L</text><rect x="489" y="378" width="95" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="536.5" y="403" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">R</text><rect x="627" y="378" width="95" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="674.5" y="403" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">F</text><rect x="765" y="378" width="95" height="38" rx="5" fill="#25856c13" stroke="#25856c"/><text x="812.5" y="403" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#25856c" font-weight="600" text-anchor="middle">B</text><text x="480" y="460" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="middle">排除同軸 U / D → 從 L、R、F、B 隨機選面與方向</text><text x="480" y="493" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="middle">選到 F 後，下一步就改為排除 F / B（Z 軸）。</text></svg>