<svg xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="title desc"><title id="title">圖 10｜材質來自分層樣式，不需要材質圖片</title><desc id="desc">貼紙上的透明黑色遮罩負責動態明暗；地面另用模糊漸層模擬軟陰影。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="610" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 10｜材質來自分層樣式，不需要材質圖片</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">貼紙上的透明黑色遮罩負責動態明暗；地面另用模糊漸層模擬軟陰影。</text><rect x="25" y="100" width="405" height="390" rx="12" fill="white" stroke="#dbe4dc"/><text x="50" y="139" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">正面：外殼 + 內縮貼紙</text><rect x="107" y="179" width="225" height="225" rx="15" fill="#161a19" stroke="#303431"/><rect x="125" y="197" width="189" height="189" rx="10" fill="#369477" stroke="#b4caba"/><text x="220" y="444" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="middle">黑框、圓角、內陰影與邊緣高光</text><text x="465" y="138" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">側面拆解（間距放大示意）</text><rect x="470" y="175" width="143" height="35" rx="5" fill="#67766e" stroke="#dbe4dc"/><path d="M621 192L654 192" stroke="#dbe4dc" stroke-width="2" fill="none"/><text x="669" y="184" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="600" text-anchor="start">明暗遮罩 ::after</text><text x="669" y="210" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="start">局部 Z = +0.9px</text><rect x="470" y="246" width="143" height="35" rx="5" fill="#369477" stroke="#dbe4dc"/><path d="M621 263L654 263" stroke="#dbe4dc" stroke-width="2" fill="none"/><text x="669" y="255" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="600" text-anchor="start">彩色貼紙 .sticker</text><text x="669" y="281" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="start">局部 Z = +0.4px</text><rect x="470" y="317" width="143" height="35" rx="5" fill="#161a19" stroke="#dbe4dc"/><path d="M621 334L654 334" stroke="#dbe4dc" stroke-width="2" fill="none"/><text x="669" y="326" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="600" text-anchor="start">黑色面板 .face</text><text x="669" y="352" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#65766e" font-weight="400" text-anchor="start">局部 Z = 0px</text><rect x="470" y="388" width="143" height="35" rx="5" fill="#343c36" stroke="#dbe4dc"/><path d="M621 405L654 405" stroke="#dbe4dc" stroke-width="2" fill="none"/><text x="669" y="397" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="600" text-anchor="start">黑色背板 ::before</te