<svg xmlns="http://www.w3.org/2000/svg" width="960" height="557" viewBox="0 0 960 557" role="img" aria-labelledby="title desc"><title id="title">圖 13｜數學向上，CSS 向下：Y 的符號要翻轉</title><desc id="desc">圖中 ⊙ 表示 +Z 朝向你；先理解軸的差異，再讀第 6 節的矩陣公式。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="555" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 13｜數學向上，CSS 向下：Y 的符號要翻轉</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">圖中 ⊙ 表示 +Z 朝向你；先理解軸的差異，再讀第 6 節的矩陣公式。</text><rect x="25" y="100" width="440" height="310" rx="12" fill="white" stroke="#dbe4dc"/><text x="47" y="138" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#24352f" font-weight="600" text-anchor="start">魔方數學座標</text><path d="M183 260L333 260" stroke="#c45f43" stroke-width="3" fill="none" marker-end="url(#x)"/><text x="346" y="267" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="400" text-anchor="start">+X</text><path d="M183 260L183 160" stroke="#397cb4" stroke-width="3" fill="none" marker-end="url(#y)"/><text x="198" y="177" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#397cb4" font-weight="600" text-anchor="start">+Y 向上</text><circle cx="183" cy="260" r="9" fill="white" stroke="#25856c" stroke-width="3"/><circle cx="183" cy="260" r="3" fill="#25856c" stroke="#25856c" stroke-width="2"/><text x="47" y="384" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">右 +X、前 +Z 的方向保持一致</text><rect x="495" y="100" width="440" height="310" rx="12" fill="white" stroke="#dbe4dc"/><text x="517" y="138" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#24352f" font-weight="600" text-anchor="start">CSS 畫面座標</text><path d="M653 260L803 260" stroke="#c45f43" stroke-width="3" fill="none" marker-end="url(#x)"/><text x="816" y="267" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="400" text-anchor="start">+X</text><path d="M653 260L653 360" stroke="#397cb4" stroke-width="3" fill="none" marker-end="url(#y)"/><text x="668" y="353" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#397cb4" font-weight="600" text-anchor="start">+Y 向下</text><circle cx="653" cy="260" r="9" fill="white" stroke="#25856c" stroke-width="3"/><circle cx="653" cy="260" r="3" fill="#25856c" stroke="#25856c" stroke-width="2"/><text x="517" y="384" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">右 +X、前 +Z 的方向保持一致</text><rect x="100" y="438" width="760" height="93" rx="8" fill="white" stroke="#dbe4dc"/><text x="480" y="476" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" fill="#24352f" font-weight="600" text-anchor="middle">[x, y, z]  →  [x, -y, z]</text><text x="480" y="510" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="middle">位置要翻轉 Y；朝向也要轉換：CSS 朝向 = S × O × S</text></svg>