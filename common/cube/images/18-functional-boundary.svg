<svg xmlns="http://www.w3.org/2000/svg" width="960" height="514" viewBox="0 0 960 514" role="img" aria-labelledby="title desc"><title id="title">圖 18｜純函數返回新資料，外層才處理副作用</title><desc id="desc">函數式設計重點是資料更新方式；整個程式仍需要事件、DOM 與排程。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="512" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 18｜純函數返回新資料，外層才處理副作用</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">函數式設計重點是資料更新方式；整個程式仍需要事件、DOM 與排程。</text><rect x="28" y="115" width="255" height="210" rx="12" fill="white" stroke="#dbe4dc"/><text x="46" y="146" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#65766e" font-weight="600" text-anchor="start">舊 cubie：保留不動</text><text x="46" y="182" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">position: [1, 1, 1]</text><text x="46" y="211" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">orientation: I</text><text x="46" y="240" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">仍可用於比較、測試</text><rect x="353" y="115" width="255" height="210" rx="12" fill="white" stroke="#dbe4dc"/><text x="371" y="146" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">純函數 rotateCubie</text><text x="371" y="182" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">輸入：舊 cubie + Move</text><text x="371" y="211" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">計算 Q × p、Q × O</text><text x="371" y="240" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">不操作 DOM、不開計時器</text><rect x="678" y="115" width="255" height="210" rx="12" fill="white" stroke="#dbe4dc"/><text x="696" y="146" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">新 cubie：返回新資料</text><text x="696" y="182" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">position: [1, -1, 1]</text><text x="696" y="211" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">orientation: Q × I</text><text x="696" y="240" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">舊物件沒有被改寫</text><path d="M292 213L342 213" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><path d="M617 213L667 213" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="110" y="375" width="740" height="110" rx="8" fill="#edf5ed" stroke="#dbe4dc"/><text x="480" y="413" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" fill="#24352f" font-weight="600" text-anchor="middle">外層接手：state = reduceState(state, action)</text><text x="480" y="453" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#65766e" font-weight="400" text-anchor="middle">renderCubies / renderConsole 再把新狀態寫進 DOM</text></svg>