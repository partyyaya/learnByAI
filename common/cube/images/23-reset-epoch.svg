<svg xmlns="http://www.w3.org/2000/svg" width="960" height="519" viewBox="0 0 960 519" role="img" aria-labelledby="title desc"><title id="title">圖 23｜清空隊列之外，還要讓舊回呼失效</title><desc id="desc">版本號像一次性入場券：復原後換了版本，舊動畫就不能再提交結果。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="517" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 23｜清空隊列之外，還要讓舊回呼失效</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">版本號像一次性入場券：復原後換了版本，舊動畫就不能再提交結果。</text><rect x="25" y="118" width="290" height="226" rx="12" fill="white" stroke="#dbe4dc"/><text x="43" y="149" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#397cb4" font-weight="600" text-anchor="start">1. 動畫進行中</text><text x="43" y="185" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">animationEpoch = 7</text><text x="43" y="214" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">F 正在轉；queue = [U, R]</text><text x="43" y="243" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">完成回呼記住 epoch = 7</text><rect x="335" y="118" width="290" height="226" rx="12" fill="white" stroke="#dbe4dc"/><text x="353" y="149" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">2. 按 Space 復原</text><text x="353" y="185" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">animationEpoch = 8</text><text x="353" y="214" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">取消 timer、rAF、手勢</text><text x="353" y="243" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">RESET：重建初始模型</text><rect x="645" y="118" width="290" height="226" rx="12" fill="white" stroke="#dbe4dc"/><text x="663" y="149" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="600" text-anchor="start">3. 舊回呼若仍到達</text><text x="663" y="185" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">收到 epoch = 7</text><text x="663" y="214" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">7 !== 8 → 直接 return</text><text x="663" y="243" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">不提交舊轉動</text><path d="M318 230L330 230" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><path d="M628 230L640 230" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="65" y="388" width="830" height="100" rx="8" fill="#edf5ed" stroke="#dbe4dc"/><text x="480" y="426" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="23" fill="#25856c" font-weight="600" text-anchor="middle">復原結果：moves = 0、queue = []、current = null</text><text x="480" y="462" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#65766e" font-weight="400" text-anchor="middle">同時關閉 transform 過渡，立即回到已復原畫面。</text></svg>