<svg xmlns="http://www.w3.org/2000/svg" width="960" height="582" viewBox="0 0 960 582" role="img" aria-labelledby="title desc"><title id="title">圖 5｜三個直欄，就是三支箭頭的數字版本</title><desc id="desc">每一欄從上到下讀取世界 X、Y、Z 分量。0 表示沒有該方向分量，−1 表示負方向。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="580" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 5｜三個直欄，就是三支箭頭的數字版本</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">每一欄從上到下讀取世界 X、Y、Z 分量。0 表示沒有該方向分量，−1 表示負方向。</text><rect x="25" y="100" width="430" height="455" rx="12" fill="white" stroke="#dbe4dc"/><rect x="475" y="100" width="460" height="455" rx="12" fill="white" stroke="#dbe4dc"/><text x="50" y="137" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">F 轉動後的 orientation</text><rect x="132" y="182" width="65" height="202" rx="8" fill="#c45f4314" stroke="#c45f43"/><text x="164" y="168" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="middle">局部 X</text><rect x="225" y="182" width="65" height="202" rx="8" fill="#397cb414" stroke="#397cb4"/><text x="257" y="168" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#397cb4" font-weight="600" text-anchor="middle">局部 Y</text><rect x="318" y="182" width="65" height="202" rx="8" fill="#25856c14" stroke="#25856c"/><text x="350" y="168" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#25856c" font-weight="600" text-anchor="middle">局部 Z</text><text x="108" y="233" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="end">世界 X</text><text x="164" y="233" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#c45f43" font-weight="600" text-anchor="middle">0</text><text x="257" y="233" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#397cb4" font-weight="600" text-anchor="middle">1</text><text x="350" y="233" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#25856c" font-weight="600" text-anchor="middle">0</text><text x="108" y="293" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="end">世界 Y</text><text x="164" y="293" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#c45f43" font-weight="600" text-anchor="middle">-1</text><text x="257" y="293" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#397cb4" font-weight="600" text-anchor="middle">0</text><text x="350" y="293" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#25856c" font-weight="600" text-anchor="middle">0</text><text x="108" y="353" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="end">世界 Z</text><text x="164" y="353" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#c45f43" font-weight="600" text-anchor="middle">0</text><text x="257" y="353" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#397cb4" font-weight="600" text-anchor="middle">0</text><text x="350" y="353" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="33" fill="#25856c" font-weight="600" text-anchor="middle">1</text><text x="50" y="426" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="start">第一欄 [0, -1, 0] → 局部 X 朝下</text><text x="50" y="469" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#397cb4" font-weight="600" text-anchor="start">第二欄 [1, 0, 0]  → 局部 Y 朝右</text><text x="50" y="512" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#25856c" font-weight="600" text-anchor="start">第三欄 [0, 0, 1]  → 局部 Z 朝前</text><text x="500" y="137" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">白色 U 貼紙屬於局部 +Y</text><rect x="502" y="172" width="405" height="75" rx="8" fill="#edf5fb" stroke="#d0e2f0"/><text x="704" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" fill="#397cb4" font-weight="600" text-anchor="middle">局部方向 = [0, 1, 0]</text><text x="704" y="229" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#397cb4" font-weight="400" text-anchor="middle">中間的 1 → 選中矩陣第二欄</text><path d="M704 260L704 296" stroke="#397cb4" stroke-width="3" fill="none" marker-end="url(#y)"/><rect x="550" y="312" width="309" height="90" rx="8" fill="#edf5fb" stroke="#397cb4"/><text x="704" y="347" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#397cb4" font-weight="600" text-anchor="middle">世界方向 = [1, 0, 0]</text><text x="704" y="379" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#397cb4" font-weight="600" text-anchor="middle">也就是世界 +X：右方</text><text x="500" y="449" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="400" text-anchor="start">orientation × [0, 1, 0]</text><text x="500" y="484" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">= 0 × 第一欄 + 1 × 第二欄</text><text x="500" y="517" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">  + 0 × 第三欄</text></svg>