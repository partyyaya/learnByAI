<svg xmlns="http://www.w3.org/2000/svg" width="960" height="631" viewBox="0 0 960 631" role="img" aria-labelledby="title desc"><title id="title">圖 8｜DOM 不是平排，而是一層包一層</title><desc id="desc">保留 preserve-3d，才能讓子層面板繼續留在三維空間。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="629" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 8｜DOM 不是平排，而是一層包一層</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">保留 preserve-3d，才能讓子層面板繼續留在三維空間。</text><rect x="28" y="102" width="904" height="465" rx="10" fill="#ffffff" stroke="#dbe4dc"/><text x="46" y="135" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">.viewport</text><text x="403" y="135" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="start">perspective：建立遠近感</text><rect x="52" y="168" width="856" height="399" rx="10" fill="#eef5ef" stroke="#dbe4dc"/><text x="70" y="201" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">.scene</text><text x="427" y="201" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="start">定位、整體 scale</text><rect x="76" y="234" width="808" height="333" rx="10" fill="#ffffff" stroke="#dbe4dc"/><text x="94" y="267" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">.view</text><text x="451" y="267" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="start">相機 rotateX / rotateY</text><rect x="100" y="300" width="760" height="267" rx="10" fill="#eef5ef" stroke="#dbe4dc"/><text x="118" y="333" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">.cube</text><text x="475" y="333" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="start">魔方世界原點</text><rect x="124" y="366" width="712" height="201" rx="10" fill="#ffffff" stroke="#dbe4dc"/><text x="142" y="399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">.cubie × 27</text><text x="499" y="399" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="start">每塊獨立 matrix3d</text><rect x="148" y="432" width="664" height="135" rx="10" fill="#eef5ef" stroke="#dbe4dc"/><text x="166" y="465" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">.face / .sticker</text><text x="523" y="465" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="start">六張面板與可選彩色貼紙</text><text x="480" y="603" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#25856c" font-weight="600" text-anchor="middle">父層的定位、旋轉與縮放會繼續作用到裡面的子層。</text></svg>