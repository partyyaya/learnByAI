<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">圖 9｜六個 CSS 平面，組成一個小立方體</title><desc id="desc">示意面板如何圍住小塊；實際六面都先有黑色底板，外側才加貼紙。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="618" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 9｜六個 CSS 平面，組成一個小立方體</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">示意面板如何圍住小塊；實際六面都先有黑色底板，外側才加貼紙。</text><rect x="25" y="103" width="430" height="400" rx="12" fill="white" stroke="#dbe4dc"/><rect x="495" y="103" width="440" height="400" rx="12" fill="white" stroke="#dbe4dc"/><text x="50" y="141" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">先準備六張面板</text><text x="520" y="141" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">旋轉 + 位移後，包住中心</text><rect x="175" y="182" width="66" height="66" rx="5" fill="#fffef5" stroke="#aab8aa"/><text x="208" y="224" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" fill="#24352f" font-weight="600" text-anchor="middle">U</text><rect x="103" y="254" width="66" height="66" rx="5" fill="#ed853f" stroke="#aab8aa"/><text x="136" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" fill="#24352f" font-weight="600" text-anchor="middle">L</text><rect x="175" y="254" width="66" height="66" rx="5" fill="#369477" stroke="#aab8aa"/><text x="208" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" fill="#24352f" font-weight="600" text-anchor="middle">F</text><rect x="247" y="254" width="66" height="66" rx="5" fill="#da5949" stroke="#aab8aa"/><text x="280" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" fill="#24352f" font-weight="600" text-anchor="middle">R</text><rect x="319" y="254" width="66" height="66" rx="5" fill="#477fbd" stroke="#aab8aa"/><text x="352" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" fill="#24352f" font-weight="600" text-anchor="middle">B</text><rect x="175" y="326" width="66" height="66" rx="5" fill="#f4c844" stroke="#aab8aa"/><text x="208" y="368" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" fill="#24352f" font-weight="600" text-anchor="middle">D</text><g transform="translate(602 190) scale(1.8)"><path d="M0 24L60 44L60 108L0 88Z" fill="#369477" stroke="#24352f"/><path d="M60 44L102 16L102 80L60 108Z" fill="#da5949" stroke="#24352f"/><path d="M0 24L42 0L102 16L60 44Z" fill="#fffef5" stroke="#24352f"/></g><text x="50" y="458" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#65766e" font-weight="400" text-anchor="start">每張都是 79px × 79px</text><text x="520" y="435" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#65766e" font-weight="400" text-anchor="start">面板離中心：79 ÷ 2 = 39.5px</text><text x="520" y="472"