<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">圖 20｜慢慢拖，也不應被當成點擊</title><desc id="desc">超過 6px 的那一刻就鎖定為視角拖曳；返回起點也不解除。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="548" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 20｜慢慢拖，也不應被當成點擊</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">超過 6px 的那一刻就鎖定為視角拖曳；返回起點也不解除。</text><rect x="25" y="100" width="430" height="425" rx="12" fill="white" stroke="#dbe4dc"/><text x="50" y="139" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">距離始終相對「按下點」</text><circle cx="210" cy="299" r="91" fill="#f3f7f2" stroke="#397cb4" stroke-width="2"/><text x="210" y="187" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="17" fill="#397cb4" font-weight="400" text-anchor="middle">6px 閾值圈（比例放大）</text><path d="M210 299L348 299" stroke="#65766e" stroke-width="2" fill="none" stroke-dasharray="6 6"/><circle cx="210" cy="299" r="7" fill="#24352f" stroke="#24352f" stroke-width="2"/><text x="177" y="328" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="400" text-anchor="start">按下點</text><circle cx="255" cy="299" r="6" fill="#397cb4" stroke="#397cb4" stroke-width="2"/><circle cx="315" cy="299" r="8" fill="#c45f43" stroke="#c45f43" stroke-width="2"/><text x="331" y="285" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="start">7px</text><path d="M315 307 Q293 384 225 320" fill="none" stroke="#c45f43" stroke-width="2.5" marker-end="url(#gray)"/><text x="240" y="401" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="start">返回 1px，仍是拖曳</text><text x="50" y="483" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">每次只移 1px，也會累計超過閾值。</text><circle cx="506" cy="132" r="17" fill="#24352f12" stroke="#24352f" stroke-width="2"/><text x="506" y="139" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="600" text-anchor="middle">1</text><text x="539" y="133" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">按下</text><text x="539" y="165" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">記住起點與當時相機</text><circle cx="506" cy="237" r="17" fill="#397cb412" stroke="#397cb4" stroke-width="2"/><text x="506" y="244" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#397cb4" font-weight="600" text-anchor="middle">2</text><text x="539" y="238" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#397cb4" font-weight="600" text-anchor="start">移到 3px</text><text x="539" y="270" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">未超過 6px，暫不當拖曳</text><circle cx="506" cy="342" r="17" fill="#c45f4312" stroke="#c45f43" stroke-width="2"/><text x="506" y="349" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="middle">3</text><text x="539" y="343" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="600" text-anchor="start">移到 7px</text><text x="539" y="375" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">dragged = true，鎖定拖曳</text><circle cx="506" cy="447" r="17" fill="#c45f4312" stroke="#c45f43" stroke-width="2"/><text x="506" y="454" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="middle">4</text><text x="539" y="448" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="600" text-anchor="start">再回到 1px</text><text x="539" y="480" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">dragged 保持 true，放開不轉層</text></svg>