<svg xmlns="http://www.w3.org/2000/svg" width="960" height="529" viewBox="0 0 960 529" role="img" aria-labelledby="title desc"><title id="title">圖 21｜點擊應轉「目前所在面」，不是原始貼紙面名</title><desc id="desc">例子：R 面順時針後，綠色貼紙由前面轉到上面。點它應轉 U 面。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="527" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 21｜點擊應轉「目前所在面」，不是原始貼紙面名</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">例子：R 面順時針後，綠色貼紙由前面轉到上面。點它應轉 U 面。</text><rect x="25" y="100" width="430" height="254" rx="12" fill="white" stroke="#dbe4dc"/><rect x="495" y="100" width="440" height="254" rx="12" fill="white" stroke="#dbe4dc"/><text x="50" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">初始：綠貼紙在世界 F 面</text><text x="520" y="136" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">轉 R 後：綠貼紙在世界 U 面</text><g transform="translate(100 175) scale(1.3)"><path d="M0 24L60 44L60 108L0 88Z" fill="#369477" stroke="#24352f"/><path d="M60 44L102 16L102 80L60 108Z" fill="#da5949" stroke="#24352f"/><path d="M0 24L42 0L102 16L60 44Z" fill="#fffef5" stroke="#24352f"/></g><g transform="translate(570 175) scale(1.3)"><path d="M0 24L60 44L60 108L0 88Z" fill="#242824" stroke="#24352f"/><path d="M60 44L102 16L102 80L60 108Z" fill="#da5949" stroke="#24352f"/><path d="M0 24L42 0L102 16L60 44Z" fill="#369477" stroke="#24352f"/></g><circle cx="636" cy="202" r="10" fill="#f9d48b" stroke="#24352f" stroke-width="2"/><text x="733" y="218" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#24352f" font-weight="600" text-anchor="start">點這張綠貼紙</text><path d="M721 214L650 205" stroke="#65766e" stroke-width="2" fill="none"/><text x="50" y="330" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">局部身分仍是 F，法線 [0, 0, 1]</text><text x="520" y="330" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">世界法線變成 [0, 1, 0]，也就是 U</text><rect x="25" y="388" width="290" height="111" rx="12" fill="white" stroke="#dbe4dc"/><text x="43" y="419" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">取得原始法線</text><text x="43" y="455" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">FACES.F.normal</text><path d="M319 443L331 443" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="335" y="388" width="290" height="111" rx="12" fill="white" stroke="#dbe4dc"/><text x="353" y="419" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">乘上目前朝向</text><text x="353" y="455" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">orientation × normal</text><path d="M629 443L641 443" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="645" y="388" width="290" height="111" rx="12" fill="white" stroke="#dbe4dc"/><text x="663" y="419" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">找到世界面名</text><text x="663" y="455" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">U → requestTurn(U)</text></svg>