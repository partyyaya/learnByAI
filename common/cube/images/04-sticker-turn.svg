<svg xmlns="http://www.w3.org/2000/svg" width="960" height="555" viewBox="0 0 960 555" role="img" aria-labelledby="title desc"><title id="title">圖 4｜貼紙跟著小塊轉，不需要重新塗色</title><desc id="desc">這是單個角塊的正面方向示意，不是整個 F 面的九格配色。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="553" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 4｜貼紙跟著小塊轉，不需要重新塗色</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">這是單個角塊的正面方向示意，不是整個 F 面的九格配色。</text><rect x="25" y="100" width="440" height="355" rx="12" fill="white" stroke="#dbe4dc"/><text x="47" y="135" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">轉動前：id = 26</text><rect x="150" y="215" width="135" height="135" rx="7" fill="#369477" stroke="#369477"/><text x="217" y="280" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" fill="white" font-weight="600" text-anchor="middle">綠 F</text><text x="217" y="309" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#e8faf1" font-weight="400" text-anchor="middle">朝向你</text><rect x="150" y="183" width="135" height="22" rx="3" fill="#fffef5" stroke="#b4bcb0"/><rect x="295" y="215" width="22" height="135" rx="3" fill="#da5949" stroke="#da5949"/><text x="217" y="171" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="600" text-anchor="middle">白 U → 朝上</text><text x="330" y="282" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#da5949" font-weight="600" text-anchor="start">紅 R</text><text x="245" y="432" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#65766e" font-weight="400" text-anchor="middle">中心位置 [1, 1, 1]</text><rect x="495" y="100" width="440" height="355" rx="12" fill="white" stroke="#dbe4dc"/><text x="517" y="135" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">轉動後：同一塊 id = 26</text><rect x="620" y="215" width="135" height="135" rx="7" fill="#369477" stroke="#369477"/><text x="687" y="280" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="26" fill="white" font-weight="600" text-anchor="middle">綠 F</text><text x="687" y="309" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#e8faf1" font-weight="400" text-anchor="middle">朝向你</text><rect x="765" y="215" width="22" height="135" rx="3" fill="#fffef5" stroke="#b4bcb0"/><rect x="620" y="360" width="135" height="22" rx="3" fill="#da5949" stroke="#da5949"/><text x="800" y="282" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#24352f" font-weight="600" text-anchor="start">白 U</text><text x="687" y="409" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#da5949" font-weight="600" text-anchor="middle">紅 R → 朝下</text><text x="715" y="432" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#65766e" font-weight="400" text-anchor="middle">中心位置 [1, -1, 1]</text><text x="480" y="493" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="middle">白貼紙：上 → 右　　紅貼紙：右 → 下　　綠貼紙：前 → 前</text><text x="480" y="528" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="middle">色條表示貼紙朝向；貼紙仍是原來三張，不換色、不改名。</text></svg>