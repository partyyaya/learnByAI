<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-labelledby="title desc"><title id="title">圖 1｜把「操作」「計算」「顯示」分開</title><desc id="desc">轉層需要更新魔方模型；拖曳觀察視角走另一條路。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="526" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 1｜把「操作」「計算」「顯示」分開</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">轉層需要更新魔方模型；拖曳觀察視角走另一條路。</text><rect x="30" y="122" width="195" height="160" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="153" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">1. 使用者輸入</text><text x="48" y="189" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">點 F 按鈕</text><text x="48" y="218" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">或按 F 鍵</text><rect x="265" y="122" width="195" height="160" rx="12" fill="white" stroke="#dbe4dc"/><text x="283" y="153" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#397cb4" font-weight="600" text-anchor="start">2. Move 指令</text><text x="283" y="189" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">face: &#x27;F&#x27;</text><text x="283" y="218" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">axis: 2, layer: 1</text><rect x="500" y="122" width="195" height="160" rx="12" fill="white" stroke="#dbe4dc"/><text x="518" y="153" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#25856c" font-weight="600" text-anchor="start">3. 純函數核心</text><text x="518" y="189" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">Q × p、Q × O</text><text x="518" y="218" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">返回新的 state</text><rect x="735" y="122" width="195" height="160" rx="12" fill="white" stroke="#dbe4dc"/><text x="753" y="153" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">4. 呈現與動畫</text><text x="753" y="189" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">寫入 CSS transform</text><text x="753" y="218" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">同步步數與歷史</text><path d="M231 202L257 202" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><path d="M466 202L492 202" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><path d="M701 202L727 202" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><rect x="258" y="303" width="444" height="47" rx="6" fill="#e9f3ec" stroke="#dbe4dc"/><text x="480" y="334" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="20" fill="#25856c" font-weight="600" text-anchor="middle">數學與模型不需要讀取 DOM</text><rect x="30" y="380" width="260" height="116" rx="12" fill="white" stroke="#dbe4dc"/><text x="48" y="411" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="600" text-anchor="start">拖曳是另一條路徑</text><text x="48" y="447" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">只更新 camera</text><rect x="350" y="380" width="260" height="116" rx="12" fill="white" stroke="#dbe4dc"/><text x="368" y="411" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="600" text-anchor="start">renderCamera</text><text x="368" y="447" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">改變 .view 的角度</text><rect x="670" y="380" width="260" height="116" rx="12" fill="white" stroke="#dbe4dc"/><text x="688" y="411" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#c45f43" font-weight="600" text-anchor="start">觀察角度改變</text><text x="688" y="447" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#65766e" font-weight="400" text-anchor="start">cubies、moves 保持不變</text><path d="M300 438L338 438" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/><path d="M620 438L658 438" stroke="#65766e" stroke-width="2.5" fill="none" marker-end="url(#gray)"/></svg>