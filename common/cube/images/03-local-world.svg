<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 960 552" role="img" aria-labelledby="title desc"><title id="title">圖 3｜orientation 記錄「小塊自己的箭頭」朝向哪裡</title><desc id="desc">從正前方看 F 面。X 用橙色、Y 用藍色、Z 用綠色標示；箭頭顏色不是貼紙顏色。</desc><defs><marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45f43"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#397cb4"/></marker><marker id="z" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25856c"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65766e"/></marker></defs><rect x="1" y="1" width="958" height="550" rx="18" fill="#f7faf6" stroke="#dbe4dc"/><text x="32" y="43" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="25" fill="#24352f" font-weight="700" text-anchor="start">圖 3｜orientation 記錄「小塊自己的箭頭」朝向哪裡</text><text x="32" y="74" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">從正前方看 F 面。X 用橙色、Y 用藍色、Z 用綠色標示；箭頭顏色不是貼紙顏色。</text><rect x="25" y="100" width="440" height="385" rx="12" fill="white" stroke="#dbe4dc"/><text x="47" y="134" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">初始：局部軸與世界軸平行</text><path d="M130 300L350 300" stroke="#65766e" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#gray)"/><path d="M225 407L225 197" stroke="#65766e" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#gray)"/><text x="360" y="306" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">世界 +X</text><text x="190" y="181" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">世界 +Y</text><rect x="187" y="262" width="76" height="76" rx="8" fill="#e9f4ed" stroke="#dbe4dc"/><path d="M225 300L301 300" stroke="#c45f43" stroke-width="5" fill="none" marker-end="url(#x)"/><text x="267" y="329" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="start">局部 +X</text><path d="M225 300L225 224" stroke="#397cb4" stroke-width="5" fill="none" marker-end="url(#y)"/><text x="238" y="239" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#397cb4" font-weight="600" text-anchor="start">局部 +Y</text><circle cx="225" cy="300" r="10" fill="#f7faf6" stroke="#25856c" stroke-width="3"/><circle cx="225" cy="300" r="3" fill="#25856c" stroke="#25856c" stroke-width="2"/><text x="47" y="418" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#25856c" font-weight="600" text-anchor="start">⊙ 局部 +Z 仍朝你：世界 +Z</text><text x="47" y="453" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="400" text-anchor="start">局部 +X → 右；局部 +Y → 上</text><rect x="495" y="100" width="440" height="385" rx="12" fill="white" stroke="#dbe4dc"/><text x="517" y="134" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="21" fill="#24352f" font-weight="600" text-anchor="start">轉動後：F 順時針 90°</text><path d="M600 300L820 300" stroke="#65766e" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#gray)"/><path d="M695 407L695 197" stroke="#65766e" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#gray)"/><text x="830" y="306" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">世界 +X</text><text x="660" y="181" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#65766e" font-weight="400" text-anchor="start">世界 +Y</text><rect x="657" y="262" width="76" height="76" rx="8" fill="#e9f4ed" stroke="#dbe4dc"/><path d="M695 300L695 376" stroke="#c45f43" stroke-width="5" fill="none" marker-end="url(#x)"/><text x="708" y="377" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#c45f43" font-weight="600" text-anchor="start">局部 +X</text><path d="M695 300L771 300" stroke="#397cb4" stroke-width="5" fill="none" marker-end="url(#y)"/><text x="737" y="329" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" fill="#397cb4" font-weight="600" text-anchor="start">局部 +Y</text><circle cx="695" cy="300" r="10" fill="#f7faf6" stroke="#25856c" stroke-width="3"/><circle cx="695" cy="300" r="3" fill="#25856c" stroke="#25856c" stroke-width="2"/><text x="517" y="418" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#25856c" font-weight="600" text-anchor="start">⊙ 局部 +Z 仍朝你：世界 +Z</text><text x="517" y="453" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#24352f" font-weight="400" text-anchor="start">局部 +X → 下；局部 +Y → 右</text><text x="480" y="524" font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" font-size="19" fill="#65766e" font-weight="400" text-anchor="middle">灰色虛線：世界軸固定　／　彩色箭頭：黏在小塊上，跟著它轉</text></svg>