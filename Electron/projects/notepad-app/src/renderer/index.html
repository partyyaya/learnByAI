<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' note-image:; object-src 'none'; base-uri 'none';"
    />
    <title>記事本</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      畫面上的文字都不寫死：data-i18n 放翻譯 key，app.js 啟動時（與切換語言時）
      統一套用，見 applyStaticTranslations()。
      data-i18n            → textContent
      data-i18n-placeholder / -aria-label / -title → 對應屬性
      這裡留的中文只是「還沒套用前」的預設值，避免第一次繪製時是空白。
    -->
    <div class="app">
      <!-- 左側：新增按鈕 + 記事列表 + 左下角偏好設定 -->
      <aside class="sidebar">
        <div class="sidebar__top">
          <button id="newNoteBtn" class="btn btn--block" type="button" data-i18n="sidebar.newNote">
            ＋ 新增記事
          </button>
        </div>

        <nav class="sidebar__list" data-i18n-aria-label="sidebar.listLabel" aria-label="記事列表">
          <ul id="noteList" class="note-list"></ul>
          <p id="listEmpty" class="note-list__empty" data-i18n="list.empty">還沒有任何記事</p>
        </nav>

        <div class="sidebar__bottom">
          <button
            id="languageBtn"
            class="icon-btn"
            type="button"
            data-i18n-aria-label="language.buttonLabel"
            data-i18n-title="language.buttonLabel"
            aria-label="語言"
            aria-haspopup="dialog"
          >
            <!-- inline SVG：CSP 擋外部資源，圖示直接寫在頁面裡不另外載檔 -->
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18" />
              <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z" />
            </svg>
          </button>

          <button
            id="themeBtn"
            class="icon-btn"
            type="button"
            data-i18n-aria-label="theme.buttonLabel"
            data-i18n-title="theme.buttonLabel"
            aria-label="外觀樣式"
            aria-haspopup="dialog"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <!-- 右半邊填滿，做出「一半黑一半白」的對比圖示 -->
              <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" />
            </svg>
          </button>

          <button
            id="storageBtn"
            class="icon-btn"
            type="button"
            data-i18n-aria-label="storage.buttonLabel"
            aria-label="記事資料"
            aria-haspopup="dialog"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
            </svg>
          </button>

          <button
            id="shortcutBtn"
            class="icon-btn"
            type="button"
            data-i18n-aria-label="shortcut.buttonLabel"
            aria-label="鍵盤快捷鍵"
            aria-haspopup="dialog"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2" y="6" width="20" height="12" rx="2" />
              <path
                d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9.5 14h5"
              />
            </svg>
          </button>
        </div>
      </aside>

      <!-- 右側：撰寫區 / 檢視區 -->
      <main class="workspace">
        <!-- 撰寫模式：新增與編輯共用同一區，差別只在底部按鈕 -->
        <section
          id="composeView"
          class="pane"
          data-i18n-aria-label="compose.label"
          aria-label="撰寫記事"
        >
          <input
            id="titleInput"
            class="title-input"
            type="text"
            maxlength="200"
            data-i18n-placeholder="compose.titlePlaceholder"
            placeholder="標題（留空會自動用當天日期時間）"
          />

          <div
            id="editor"
            class="editor is-empty"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            data-i18n-aria-label="compose.editorLabel"
            aria-label="記事內容"
            data-placeholder="在這裡輸入內容，可以直接貼上文字或圖片"
          ></div>

          <footer class="pane__footer">
            <span id="composeHint" class="hint" role="status"></span>
            <button id="cancelEditBtn" class="btn btn--ghost is-hidden" type="button">
              取消編輯
            </button>
            <button id="addBtn" class="btn btn--primary" type="button">新增</button>
          </footer>
        </section>

        <!-- 檢視模式：點左側列表的記事會切到這裡 -->
        <section
          id="readView"
          class="pane is-hidden"
          data-i18n-aria-label="read.label"
          aria-label="檢視記事"
        >
          <h1 id="readTitle" class="read-title"></h1>
          <p id="readTime" class="read-time"></p>
          <div id="readBody" class="read-body"></div>

          <footer class="pane__footer">
            <span class="hint" data-i18n="read.hint">按左上角「新增記事」可回到撰寫模式</span>
            <button id="deleteBtn" class="btn btn--danger" type="button" data-i18n="read.delete">
              刪除這篇
            </button>
            <button id="editBtn" class="btn btn--primary" type="button" data-i18n="read.edit">
              開始編輯
            </button>
          </footer>
        </section>
      </main>
    </div>

    <!-- 語言：選項一律用該語言自己的寫法，不跟著介面翻譯 -->
    <dialog id="languageDialog" class="dialog" aria-labelledby="languageDialogTitle">
      <h2 id="languageDialogTitle" class="dialog__title" data-i18n="language.title">語言</h2>
      <div class="picker-options" role="radiogroup" aria-labelledby="languageDialogTitle">
        <button class="picker-option" type="button" role="radio" data-language="zh-Hant">
          <span class="picker-option__name">中文</span>
          <span class="picker-option__hint">zh-Hant</span>
        </button>
        <button class="picker-option" type="button" role="radio" data-language="en">
          <span class="picker-option__name">English</span>
          <span class="picker-option__hint">en</span>
        </button>
      </div>
      <footer class="dialog__footer">
        <span id="languageHint" class="hint" role="status"></span>
        <button id="languageCloseBtn" class="btn btn--ghost" type="button" data-i18n="dialog.close">
          關閉
        </button>
      </footer>
    </dialog>

    <!-- 記事資料：匯出 / 匯入 / 開啟儲存位置 -->
    <dialog id="storageDialog" class="dialog" aria-labelledby="storageDialogTitle">
      <h2 id="storageDialogTitle" class="dialog__title" data-i18n="storage.title">記事資料</h2>
      <div class="action-list">
        <button id="exportBtn" class="action" type="button">
          <span class="action__name" data-i18n="storage.export">匯出備份</span>
          <span class="action__hint" data-i18n="storage.exportHint">
            把設定、記事與圖片存成一個檔案
          </span>
        </button>
        <button id="importBtn" class="action" type="button">
          <span class="action__name" data-i18n="storage.import">匯入備份</span>
          <span class="action__hint" data-i18n="storage.importHint">
            用匯出的檔案還原，會覆蓋目前的內容
          </span>
        </button>
        <button id="openFolderBtn" class="action" type="button">
          <span class="action__name" data-i18n="storage.openFolder">開啟儲存位置</span>
          <span class="action__hint" data-i18n="storage.openFolderHint">
            用檔案總管打開記事資料夾
          </span>
        </button>
      </div>

      <p class="storage-path">
        <span class="storage-path__label" data-i18n="storage.pathLabel">目前位置</span>
        <code id="storagePath" class="storage-path__value"></code>
      </p>

      <footer class="dialog__footer">
        <button id="storageCloseBtn" class="btn btn--ghost" type="button" data-i18n="dialog.close">
          關閉
        </button>
      </footer>
    </dialog>

    <!-- 外觀樣式：白 / 黑 -->
    <dialog id="themeDialog" class="dialog" aria-labelledby="themeDialogTitle">
      <h2 id="themeDialogTitle" class="dialog__title" data-i18n="theme.title">外觀樣式</h2>
      <div class="picker-options" role="radiogroup" aria-labelledby="themeDialogTitle">
        <button class="picker-option" type="button" role="radio" data-theme="light">
          <span class="theme-swatch theme-swatch--light" aria-hidden="true"></span>
          <span class="picker-option__name" data-i18n="theme.light">白</span>
          <span class="picker-option__hint">#fcfcfc</span>
        </button>
        <button class="picker-option" type="button" role="radio" data-theme="dark">
          <span class="theme-swatch theme-swatch--dark" aria-hidden="true"></span>
          <span class="picker-option__name" data-i18n="theme.dark">黑</span>
          <span class="picker-option__hint">#0d1117</span>
        </button>
      </div>
      <footer class="dialog__footer">
        <span id="themeHint" class="hint" role="status"></span>
        <button id="themeCloseBtn" class="btn btn--ghost" type="button" data-i18n="dialog.close">
          關閉
        </button>
      </footer>
    </dialog>

    <!-- 快捷鍵說明：用原生 <dialog>，Esc 關閉與 backdrop 都是瀏覽器內建的 -->
    <dialog id="shortcutDialog" class="dialog" aria-labelledby="shortcutDialogTitle">
      <h2 id="shortcutDialogTitle" class="dialog__title">鍵盤快捷鍵</h2>
      <dl id="shortcutList" class="shortcut-list"></dl>
      <footer class="dialog__footer">
        <button
          id="shortcutCloseBtn"
          class="btn btn--ghost"
          type="button"
          data-i18n="dialog.close"
        >
          關閉
        </button>
      </footer>
    </dialog>

    <!--
      取代 window.confirm()：原生對話框的「OK / Cancel」是作業系統給的，
      改不了語言也吃不到主題顏色。用 <form method="dialog"> 讓按鈕自己帶回 returnValue。
    -->
    <dialog id="confirmDialog" class="dialog dialog--confirm" aria-labelledby="confirmMessage">
      <p id="confirmMessage" class="dialog__message"></p>
      <form method="dialog" class="dialog__footer">
        <button id="confirmCancelBtn" class="btn btn--ghost" value="cancel"></button>
        <button id="confirmOkBtn" class="btn btn--danger" value="ok"></button>
      </form>
    </dialog>

    <script src="./i18n.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
