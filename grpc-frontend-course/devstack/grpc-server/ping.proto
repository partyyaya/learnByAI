syntax = "proto3";

package ping.v1;

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Watch(WatchRequest) returns (stream PingResponse);
}

message PingRequest {
  string message = 1;
}

message WatchRequest {
  string message = 1;
  int32 count = 2;
  int32 interval_ms = 3;
}

message PingResponse {
  string message = 1;
  int64 server_time_unix_ms = 2;
}
