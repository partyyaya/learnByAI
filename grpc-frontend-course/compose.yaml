name: grpc-frontend-course

services:
  grpc-server:
    build:
      context: .
      dockerfile: ./devstack/grpc-server/Dockerfile
    container_name: grpc-course-grpc-server
    ports:
      - "50051:50051"
    restart: unless-stopped

  grpc-web-proxy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: grpc-course-envoy
    depends_on:
      - grpc-server
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./devstack/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: ./devstack/frontend/Dockerfile
    container_name: grpc-course-frontend
    depends_on:
      - grpc-web-proxy
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
    ports:
      - "5173:5173"
    restart: unless-stopped
