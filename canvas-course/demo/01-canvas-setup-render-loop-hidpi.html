{ id:'hello-context', label:'1.1 取得畫布與繪圖環境(context)', code:`// 拿到 ctx 就能下命令:canvas 是畫框,ctx 才是畫圖的畫筆
ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 0, W, H);              // 填滿整塊當底色

ctx.fillStyle = '#38bdf8';
ctx.fillRect(30, 40, 120, 80);         // fillRect(x, y, 寬, 高)

ctx.fillStyle = '#f8fafc';
ctx.textBaseline = 'top';
ctx.font = '16px sans-serif';
ctx.fillText('context 已就緒', 30, 150);
ctx.font = '12px sans-serif';
ctx.fillStyle = '#94a3b8';
ctx.fillText('canvas 元素本身不畫圖,真正畫圖的是 ctx', 30, 178);
ctx.fillText('這塊畫布邏輯尺寸 W=' + W + ' H=' + H, 30, 198);` },

{ id:'coordinate-system', label:'1.2 座標系:原點左上、y 往下', code:`// 原點在左上,x 往右變大、y 往下變大(跟數學課相反)
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, W, H);

ctx.strokeStyle = '#334155';           // 從原點畫出 x 軸與 y 軸
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(0, 0); ctx.lineTo(W - 10, 0);
ctx.moveTo(0, 0); ctx.lineTo(0, H - 10);
ctx.stroke();

ctx.fillStyle = '#334155';
ctx.textBaseline = 'top';
ctx.font = '13px sans-serif';
ctx.fillText('x 往右變大', W - 110, 8);
ctx.fillText('y 往下變大', 8, H - 22);
ctx.fillText('(0,0) 原點在左上', 14, 8);

ctx.fillStyle = '#0f172a';             // 原點
ctx.beginPath();
ctx.arc(0, 0, 5, 0, Math.PI * 2);
ctx.fill();

const px = 120, py = 80;               // 標一個點 (120, 80)
ctx.strokeStyle = '#e11d48';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(px - 10, py); ctx.lineTo(px + 10, py);
ctx.moveTo(px, py - 10); ctx.lineTo(px, py + 10);
ctx.stroke();
ctx.fillStyle = '#e11d48';
ctx.beginPath();
ctx.arc(px, py, 3, 0, Math.PI * 2);
ctx.fill();
ctx.fillText('(120, 80)', px + 12, py - 4);` },

{ id:'buffer-vs-css', label:'1.3 緩衝區尺寸 ≠ CSS 顯示尺寸', code:`// 小緩衝區的圖被拉大顯示 → 糊;長寬比不同 → 還會變形(小照片硬撐進不同比例的相框)
ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 0, W, H);

const boxW = Math.round(Math.min(170, (W - 60) / 2));   // 兩個框並排,依畫布寬度縮放
const boxH = Math.round(boxW * 0.7);

function paint(g, w, h) {                  // 在 w x h 的緩衝區上畫:底圖 + 正中央一個正圓
  g.drawImage(sampleImage, 0, 0, w, h);
  g.strokeStyle = '#fff';
  g.lineWidth = 2;
  g.beginPath();
  g.arc(w / 2, h / 2, h * 0.3, 0, Math.PI * 2);
  g.stroke();
}

// 左:緩衝區只有 60x30(2:1),再撐進約 1.4:1 的框 → 糊 + 圓被拉成橢圓
const small = document.createElement('canvas');
small.width = 60; small.height = 30;
paint(small.getContext('2d'), 60, 30);
ctx.drawImage(small, 20, 60, boxW, boxH);

// 右:緩衝區尺寸 = 顯示尺寸 → 清晰,圓還是圓
const ok = document.createElement('canvas');
ok.width = boxW; ok.height = boxH;
paint(ok.getContext('2d'), boxW, boxH);
ctx.drawImage(ok, W - boxW - 20, 60, boxW, boxH);

ctx.textBaseline = 'top';
ctx.font = '13px sans-serif';
ctx.fillStyle = '#f87171';
ctx.fillText('左:60x30 緩衝區撐大 → 糊 + 變形', 20, 12);
ctx.fillStyle = '#4ade80';
ctx.fillText('右:緩衝區 = 顯示尺寸 → 清晰', 20, 32);` },

{ id:'hidpi-sharp-vs-blurry', label:'1.4 HiDPI:清晰 vs 模糊對比', code:`// 主畫布設成 HiDPI,再比較 1:1 緩衝區 vs 放大 DPR 倍的緩衝區
// 一般螢幕(DPR=1)兩邊會一樣:用瀏覽器縮放到 200% 再看(縮放會改變 DPR,畫面會自動重跑)
const dpr = window.devicePixelRatio || 1;
canvas.width = Math.round(W * dpr);        // 緩衝區 = 邏輯尺寸 x DPR
canvas.height = Math.round(H * dpr);
canvas.style.width = W + 'px';             // CSS 顯示維持邏輯尺寸
canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);                       // 之後照邏輯座標畫,自動對應物理像素

ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 0, W, H);

// 同一份內容:細字 + 細線最能看出銳利差別
function paint(c, w, h) {
  c.fillStyle = '#111827';
  c.fillRect(0, 0, w, h);
  c.fillStyle = '#f8fafc';
  c.textBaseline = 'top';
  c.font = '15px sans-serif';
  c.fillText('Retina 銳利度', 10, 12);
  c.fillText('abcdefg 12345', 10, 36);
  c.strokeStyle = '#38bdf8';
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 0; i < 5; i++) { c.moveTo(10, 66 + i * 7); c.lineTo(w - 10, 66 + i * 7); }
  c.stroke();
}

const bw = Math.round(Math.min(170, (W - 60) / 2)), bh = 110;   // 兩個框並排,寬度依畫布縮放

// 糊:離屏緩衝區 = 邏輯尺寸(1:1),drawImage 時被 DPR 放大 → 糊
const blur = document.createElement('canvas');
blur.width = bw; blur.height = bh;
paint(blur.getContext('2d'), bw, bh);
ctx.drawImage(blur, 20, 56, bw, bh);

// 清晰:離屏緩衝區 = 邏輯尺寸 x DPR,先 scale 再畫,drawImage 縮回顯示 → 銳利
const sharp = document.createElement('canvas');
sharp.width = Math.round(bw * dpr);
sharp.height = Math.round(bh * dpr);
const sc = sharp.getContext('2d');
sc.scale(dpr, dpr);
paint(sc, bw, bh);
ctx.drawImage(sharp, W - bw - 20, 56, bw, bh);

ctx.textBaseline = 'top';
ctx.font = '13px sans-serif';
ctx.fillStyle = '#f87171';
ctx.fillText('左:1:1 緩衝區 → 糊', 20, 12);
ctx.fillStyle = '#4ade80';
ctx.fillText('右:x' + dpr + ' 緩衝區 → 清晰', 20, 32);` },

{ id:'raf-bouncing-ball', label:'1.5 requestAnimationFrame:反彈的球', code:`// 動畫:一顆球四面反彈,每幀先 clearRect 清掉再重畫
const ball = { x: 80, y: 90, r: 18, vx: 3.2, vy: 2.4 };

function frame() {
  ctx.clearRect(0, 0, W, H);           // 1. 清:擦掉上一幀(不然殘留疊加)
  ball.x += ball.vx;                   // 2. 算:更新自己維護的位置資料
  ball.y += ball.vy;
  // 撞牆反彈:先推回牆內,再依撞到哪面牆決定速度方向(撞左牆 → 往右,依此類推)
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
  else if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }
  ctx.fillStyle = '#e63946';           // 3. 畫:照新位置重畫
  ctx.beginPath();                     // 開新路徑,避免和上一幀相連
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  requestAnimationFrame(frame);        // 4. 預約下一幀(重跑自動停舊迴圈)
}

requestAnimationFrame(frame);` },

{ id:'loop-skeleton', label:'1.5 渲染迴圈骨架:清 → 算 → 畫', code:`// 動畫:把渲染迴圈拆成三拍子——clear、update、render 三個函式
const stateData = { t: 0, x: 40 };

function clear() {                       // 第 1 拍:清空(用底色蓋掉上一幀)
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, W, H);
}

function update() {                      // 第 2 拍:更新你自己維護的資料
  stateData.t += 1;
  stateData.x = 40 + (W - 80) * (0.5 + 0.5 * Math.sin(stateData.t * 0.03));
}

function render() {                      // 第 3 拍:照新狀態重畫
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(40, 130, W - 80, 6);      // 軌道
  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.arc(stateData.x, 133, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.textBaseline = 'top';
  ctx.font = '15px sans-serif';
  ctx.fillText('迴圈骨架:clear -> update -> render', 40, 30);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('已跑 ' + stateData.t + ' 幀', 40, 56);
}

function frame() {
  clear();                               // 清
  update();                              // 算
  render();                              // 畫
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);` },

{ id:'clear-and-trail', label:'1.6 清空畫布:殘留與拖尾陷阱', code:`// 動畫:示範 1.6——沒把畫布清乾淨會殘留疊加成拖尾
const dot = { a: 0 };

function frame() {
  // 只用半透明色蓋一層(而非徹底 clearRect)→ 上一幀沒清乾淨 → 拖尾
  ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
  ctx.fillRect(0, 0, W, H);

  dot.a += 0.04;
  const x = W / 2 + Math.cos(dot.a) * 90;        // 落在 110..290
  const y = H / 2 + Math.sin(dot.a * 1.3) * 70;  // 落在 60..200

  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#e2e8f0';
  ctx.textBaseline = 'top';
  ctx.font = '13px sans-serif';
  ctx.fillText('半透明覆蓋(非徹底清)→ 殘留成拖尾', 12, 12);
  ctx.fillText('要乾淨畫面:改用 clearRect(0,0,W,H) 每幀清空', 12, 32);
  // 細看會發現拖尾永遠淡不乾淨:每次只蓋 8%,像素是 0~255 的整數,差距小到一個程度就捨入不動了

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);` },

{ id:'width-reset', label:'1.6 陷阱:canvas.width 重設會洗掉 scale', code:`// 動畫:每 1.5 秒切換一次清空方式,對比 clearRect 與 canvas.width = canvas.width(核彈)
const dpr = Math.max(2, window.devicePixelRatio || 1);   // 至少用 2 倍,一般螢幕也看得出差別
canvas.width = Math.round(W * dpr);                      // 1.4 的 HiDPI 設定:緩衝區 = 邏輯尺寸 x DPR
canvas.height = Math.round(H * dpr);
canvas.style.width = W + 'px';                           // CSS 顯示維持邏輯尺寸
canvas.style.height = H + 'px';

function drawScene(color, msg) {                         // 用「邏輯座標」畫一個應該填滿整塊畫布的場景
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'top';
  ctx.font = '14px sans-serif';
  ctx.fillText(msg, 12, 12);
}

let lastSwitch = null, nuke = true;
function frame(t) {
  if (lastSwitch === null || t - lastSwitch > 1500) { lastSwitch = t; nuke = !nuke; }
  if (nuke) {
    canvas.width = canvas.width;                         // 核彈:清像素 + 所有狀態歸零,scale(dpr) 也沒了
    drawScene('#e11d48', 'canvas.width 重設');           // 同一段邏輯座標程式 → 只畫到左上 1/dpr
    // 說明文字:現在座標單位是「緩衝區像素」,位置和字級都要自己乘 dpr 才看得清
    ctx.fillStyle = '#e11d48';
    ctx.font = 13 * dpr + 'px sans-serif';
    ctx.fillText('scale 被洗掉 → 縮在左上 1/' + dpr, 12 * dpr, H + 12 * dpr);
  } else {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);              // 縮放設回 dpr 倍(等同重設後再 scale)
    ctx.clearRect(0, 0, W, H);                           // 一般做法:只清像素,縮放保留
    drawScene('#2563eb', 'clearRect → 填滿整塊');
  }
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);` },
{ id:'homework', label:'💡 動手作業:五顆彈跳球', code:
`// 第 01 章作業:5 顆顏色/大小/速度都不同的球,用一個陣列 + 迴圈管理
// (playground 已提供 ctx/canvas/W/H;正式頁面要自己做 1.4 的 HiDPI 設定)
const balls = [                           // 初始位置用 W/H 的比例,畫布多大都從框內出發
  { x: W * 0.15, y: H * 0.25, r: 14, vx: 2.6, vy: 1.8,  color: '#e63946' },
  { x: W * 0.45, y: H * 0.6,  r: 9,  vx: -2,  vy: 3,    color: '#457b9d' },
  { x: W * 0.75, y: H * 0.35, r: 20, vx: 1.4, vy: -1.6, color: '#2a9d8f' },
  { x: W * 0.85, y: H * 0.75, r: 11, vx: -3,  vy: -2.4, color: '#f4a261' },
  { x: W * 0.3,  y: H * 0.8,  r: 17, vx: 2,   vy: -3,   color: '#9b5de5' },
];
function update() {                       // 作業要求:在 update 用迴圈逐顆更新
  for (const b of balls) {
    b.x += b.vx; b.y += b.vy;
    // 撞牆反彈(1.5 的寫法):先推回牆內,再依撞到哪面牆決定速度方向
    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
    else if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); }
    else if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy); }
  }
}
function render() {                       // 作業要求:在 render 也用迴圈,照各自資料畫
  for (const b of balls) {
    ctx.fillStyle = b.color;              // 每顆球用自己的顏色
    ctx.beginPath();                      // 開新路徑,免得這顆和上一顆連在一起
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}
function frame() {
  ctx.clearRect(0, 0, W, H);              // 清:一次擦掉 5 顆球
  update();                               // 算:更新每顆球位置
  render();                               // 畫:照新資料重畫
  requestAnimationFrame(frame);           // 預約下一幀,形成自我延續的迴圈
}
requestAnimationFrame(frame);` }
  ]
};
