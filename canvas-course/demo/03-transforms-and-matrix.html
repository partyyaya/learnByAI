`// 套路:translate(中心) → rotate → 以中心為原點畫(-w/2,-h/2)
function drawRotatedRect(cx, cy, w, h, angle, color) {
  ctx.save();
  ctx.translate(cx, cy);              // 1. 原點移到圖形中心
  ctx.rotate(angle);                  // 2. 繞這個中心轉
  ctx.fillStyle = color;
  ctx.fillRect(-w / 2, -h / 2, w, h); // 3. 以中心為原點畫
  ctx.restore();

// 同一個中心、不同角度 → 全都繞自己中心轉,位置不會跑掉

drawRotatedRect(W / 2, H / 2, s, s, Math.PI / 8, 'rgba(69,123,157,.5)');
drawRotatedRect(W / 2, H / 2, s, s, Math.PI / 4, '#457b9d');

// 對照組:沒 translate 到中心就直接 rotate → 繞畫布左上角轉走了

{ id: 'matrix', label: '3.4 矩陣 a~f + 逆矩陣:把滑鼠點反算回區域座標', code:
`// 依序 translate → rotate → scale,每一步用 getTransform() 印出 a,b,c,d,e,f;
// 再用 inverse() 把滑鼠的螢幕點反算回「最後那個區域座標系」,在區域座標裡畫十字
let mouse = { x: W * 0.6, y: H * 0.6 };
canvas.style.touchAction = 'none';
const fmt = (m) => [m.a, m.b, m.c, m.d, m.e, m.f].map(v => +v.toFixed(2)).join(',');

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const log = ['單位      ' + fmt(ctx.getTransform())];   // getTransform() → 目前矩陣的複本(DOMMatrix)
  ctx.translate(W * 0.5, H * 0.45); log.push('translate ' + fmt(ctx.getTransform()));
  ctx.rotate(Math.PI / 6);          log.push('rotate    ' + fmt(ctx.getTransform()));
  ctx.scale(1.5, 1);                log.push('scale     ' + fmt(ctx.getTransform()));

  // 在最後的區域座標系畫一個 50×30 的框和兩條軸:這就是「紙」現在的擺法
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#457b9d'; ctx.strokeRect(0, 0, 50, 30);
  ctx.strokeStyle = '#e63946'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(40, 0); ctx.stroke();   // 區域 x 軸 = (a,b)
  ctx.strokeStyle = '#2a9d8f'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40); ctx.stroke();   // 區域 y 軸 = (c,d)

  // 逆矩陣:螢幕點 → 區域座標。在「區域座標」畫十字,它應該剛好落在游標上
  const local = ctx.getTransform().inverse().transformPoint({ x: mouse.x, y: mouse.y });   // inverse() → 逆矩陣;transformPoint(點) → 套用
  ctx.strokeStyle = '#1d3557';
  ctx.beginPath();
  ctx.moveTo(local.x - 6, local.y); ctx.lineTo(local.x + 6, local.y);
  ctx.moveTo(local.x, local.y - 6); ctx.lineTo(local.x, local.y + 6);
  ctx.stroke();

  ctx.setTransform(1, 0, 0, 1, 0, 0);   // 文字用螢幕座標畫
  ctx.font = '10px monospace'; ctx.fillStyle = '#333';
  log.forEach((s, i) => ctx.fillText(s, 6, 14 + i * 13));
  ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = '#1d3557';
  ctx.fillText('區域座標 (' + local.x.toFixed(1) + ', ' + local.y.toFixed(1) + ')', 6, H - 8);
}
canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
  render();
});
render();` },
{ id: 'camera', label: '3.5 相機:拖曳平移(滾輪只改 zoom → 繞左上角縮放)', code:
`// 互動:按住拖曳平移;滾輪「只改 zoom」→ 畫面繞左上角縮放(3.7 的範例會修好它)
const camera = { x: 0, y: 0, zoom: 1 };   // x/y = 畫面左上角對到的世界座標
let dragging = false, last = null;
let mouse = { x: W / 2, y: H / 2 };
canvas.style.cursor = 'grab';
canvas.style.touchAction = 'none';        // 觸控拖曳不被瀏覽器手勢搶走

function getCanvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function screenToWorld(p) {   // 螢幕 → 世界:相機的逆運算(先 ÷zoom、再 +camera)
  return { x: p.x / camera.zoom + camera.x, y: p.y / camera.zoom + camera.y };
}

function drawWorld() {
  // 全部用「世界座標」畫,完全不知道相機存在
  ctx.drawImage(sampleImage, 20, 20);
  ctx.fillStyle = '#e63946';
  ctx.fillRect(70, 190, 60, 40);
  ctx.fillStyle = '#2a9d8f';
  ctx.beginPath(); ctx.arc(200, 210, 26, 0, Math.PI * 2); ctx.fill();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);    // 先重設、清空,再套相機
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#eef1f4';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(camera.zoom, camera.zoom);   // 先縮放
  ctx.translate(-camera.x, -camera.y);   // 再平移(相機往右看 = 世界往左移)
  drawWorld();
  ctx.restore();

  const wpt = screenToWorld(mouse);      // 滑鼠螢幕座標 → 世界座標
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(0, H - 22, W, 22);
  ctx.fillStyle = '#fff';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('世界(' + wpt.x.toFixed(0) + ',' + wpt.y.toFixed(0) + ')  zoom=' + camera.zoom.toFixed(2), 8, H - 7);
}

canvas.addEventListener('pointerdown', (e) => {
  dragging = true; canvas.style.cursor = 'grabbing';
  last = getCanvasPoint(e);
  canvas.setPointerCapture(e.pointerId);   // 拖出畫布外也持續收到事件
});
canvas.addEventListener('pointermove', (e) => {
  const p = getCanvasPoint(e); mouse = p;
  if (dragging) {
    camera.x -= (p.x - last.x) / camera.zoom;   // 反向移動相機(記得除以 zoom)
    camera.y -= (p.y - last.y) / camera.zoom;
    last = p;
  }
  render();
});
function endDrag() { dragging = false; canvas.style.cursor = 'grab'; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY === 0) return;                                // 純水平捲動不縮放
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // deltaMode 1 = 以「行」為單位,約略換成像素
  camera.zoom = Math.max(0.3, Math.min(camera.zoom * Math.exp(-dy * 0.002), 6));   // 只改 zoom:繞畫面左上角縮放
  render();
}, { passive: false });

render();` },
{ id: 'screen-world', label: '3.6 螢幕座標 ↔ 世界座標(滑鼠反算)', code:
`// 互動:移動滑鼠,看螢幕座標如何反算成世界座標(相機有位移+縮放,兩者不相等)
// 固定相機;zoom 依畫布大小調整,小畫布也看得到整片世界
const camera = { x: -20, y: -15, zoom: Math.min(1.5, W / 230, H / 165) };
let mouse = { x: W / 2, y: H / 2 };

function getCanvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function screenToWorld(p) {   // 螢幕 → 世界:相機逆運算(先 ÷zoom、再 +camera)
  return { x: p.x / camera.zoom + camera.x, y: p.y / camera.zoom + camera.y };
}
function worldToScreen(p) {   // 世界 → 螢幕:相機正向運算
  return { x: (p.x - camera.x) * camera.zoom, y: (p.y - camera.y) * camera.zoom };
}

function drawWorld() {
  ctx.strokeStyle = '#dee2e6'; ctx.lineWidth = 1;
  for (let x = 0; x <= 200; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 140); ctx.stroke(); }
  for (let y = 0; y <= 140; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(200, y); ctx.stroke(); }
  ctx.fillStyle = '#457b9d';
  ctx.fillRect(90, 90, 20, 20);   // 住在世界座標 (100,100) 的地標
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);
  drawWorld();
  ctx.restore();

  // worldToScreen:把世界 (100,100) 算回螢幕,標上文字
  const s = worldToScreen({ x: 100, y: 100 });
  ctx.fillStyle = '#1d3557'; ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('世界(100,100)', s.x + 16, s.y + 4);

  // screenToWorld:把滑鼠螢幕座標反算成世界座標,並畫十字
  const w = screenToWorld(mouse);
  ctx.strokeStyle = '#e63946'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mouse.x - 9, mouse.y); ctx.lineTo(mouse.x + 9, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 9); ctx.lineTo(mouse.x, mouse.y + 9);
  ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, 20);
  ctx.fillStyle = '#fff'; ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('螢幕(' + mouse.x.toFixed(0) + ',' + mouse.y.toFixed(0) + ') → 世界(' + w.x.toFixed(0) + ',' + w.y.toFixed(0) + ')', 8, 14);
}

canvas.addEventListener('pointermove', (e) => { mouse = getCanvasPoint(e); render(); });
render();` },
{ id: 'zoom-cursor', label: '3.7 以游標為中心縮放:游標下的世界點不動', code:
`// 滾輪縮放時,先記住游標下的世界點 → 改 zoom → 把相機平移差值,讓那個點回到游標下
// 對照 3.5 的範例:那邊只改 zoom,畫面繞左上角縮放
const camera = { x: 0, y: 0, zoom: 1 };
let mouse = { x: W / 2, y: H / 2 };
let lastBefore = null, lastAfter = null;
canvas.style.touchAction = 'none';

function getCanvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function screenToWorld(p) {
  return { x: p.x / camera.zoom + camera.x, y: p.y / camera.zoom + camera.y };
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#eef1f4'; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);
  ctx.drawImage(sampleImage, 20, 20);                   // 世界裡的東西
  ctx.fillStyle = '#e63946'; ctx.fillRect(70, 190, 60, 40);
  ctx.restore();

  ctx.strokeStyle = '#1d3557'; ctx.lineWidth = 1.5;     // 游標十字
  ctx.beginPath();
  ctx.moveTo(mouse.x - 9, mouse.y); ctx.lineTo(mouse.x + 9, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 9); ctx.lineTo(mouse.x, mouse.y + 9);
  ctx.stroke();

  const w = screenToWorld(mouse);
  const f = (p) => '(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ')';
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, W, 38);
  ctx.fillStyle = '#fff'; ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('游標下世界點 ' + f(w) + ' zoom=' + camera.zoom.toFixed(2), 8, 15);
  if (lastBefore) ctx.fillText('縮放前 ' + f(lastBefore) + ' → 後 ' + f(lastAfter), 8, 31);
}

canvas.addEventListener('pointermove', (e) => { mouse = getCanvasPoint(e); render(); });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY === 0) return;                                // 純水平捲動(Shift+滾輪、觸控板橫滑)不縮放
  const p = getCanvasPoint(e);
  const before = screenToWorld(p);                           // 1. 縮放前,游標指著的世界座標
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // deltaMode 1 = 以「行」為單位,約略換成像素
  const factor = Math.exp(-dy * 0.002);                      // 2. 連續倍率:觸控板的小 delta 只縮一點,滑鼠一格約 ×1.2
  camera.zoom = Math.max(0.2, Math.min(camera.zoom * factor, 8));
  const after = screenToWorld(p);                            // 3. 縮放後,同一螢幕點指著的世界座標
  camera.x += before.x - after.x;                            // 4. 平移差值 → 游標下的世界點回到原位
  camera.y += before.y - after.y;
  lastBefore = before; lastAfter = screenToWorld(p);         // 兩者應該相等
  mouse = p;
  render();
}, { passive: false });

render();` },
{ id:'homework', label:'💡 動手作業:可平移縮放的無限網格', code:
`// 第 03 章作業:相機 + 無限網格。拖曳平移、滾輪以游標為中心縮放,左上角即時顯示世界座標
const camera = { x: 0, y: 0, zoom: 1 };    // 物件住世界座標裡不動,變的只是相機(3.5)
function applyCamera(ctx, camera) {
  ctx.scale(camera.zoom, camera.zoom);     // 先縮放
  ctx.translate(-camera.x, -camera.y);     // 再平移:相機往右看 = 世界往左移
}
function getCanvasPoint(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function screenToWorld(s, cam) {            // 相機的逆運算(3.6)
  return { x: s.x / cam.zoom + cam.x, y: s.y / cam.zoom + cam.y };
}
let mouse = { x: 0, y: 0 };
// 作業要求 1:拖曳平移——setPointerCapture 讓放開時就算移出畫布也收得到;完整健壯性見第 07 章 7.8

let dragging = false, last = null;
canvas.addEventListener('pointerdown', (e) => { dragging = true; last = getCanvasPoint(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup',   (e) => { dragging = false; canvas.releasePointerCapture(e.pointerId); });
canvas.addEventListener('pointercancel', () => { dragging = false; });   // 被系統打斷時不會有 pointerup
canvas.addEventListener('pointermove', (e) => {
  const p = getCanvasPoint(e); mouse = p;
  if (dragging) {
    camera.x -= (p.x - last.x) / camera.zoom;   // 拖曳反向移動相機,記得除以 zoom
    camera.y -= (p.y - last.y) / camera.zoom;
    last = p;
  }
});
// 作業要求 3:滾輪以游標為中心縮放(3.7 整段搬入)
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY === 0) return;                                // 純水平捲動(Shift+滾輪、觸控板橫滑)不縮放
  const s = getCanvasPoint(e);
  const before = screenToWorld(s, camera);                   // 縮放前游標指著的世界座標
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // deltaMode 1 = 以「行」為單位,約略換成像素
  camera.zoom *= Math.exp(-dy * 0.002);                      // 連續倍率:觸控板的小 delta 只縮一點,滑鼠一格約 ×1.2
  camera.zoom = Math.max(0.2, Math.min(camera.zoom, 20));
  const after = screenToWorld(s, camera);       // 縮放後同一螢幕點指著的世界座標
  camera.x += before.x - after.x;               // 平移差值,讓游標下的世界點回到原位
  camera.y += before.y - after.y;
}, { passive: false });
// 作業要求 4:「無限」網格——格線起訖依可視範圍計算,平移到哪都有格線
const GRID = 50;
function drawGrid() {
  const tl = screenToWorld({ x: 0, y: 0 }, camera);   // 把螢幕四角換算回世界座標
  const br = screenToWorld({ x: W, y: H }, camera);
  ctx.strokeStyle = '#d0d7de';

  ctx.beginPath();
  for (let x = Math.floor(tl.x / GRID) * GRID; x <= br.x; x += GRID) { ctx.moveTo(x, tl.y); ctx.lineTo(x, br.y); }
  for (let y = Math.floor(tl.y / GRID) * GRID; y <= br.y; y += GRID) { ctx.moveTo(tl.x, y); ctx.lineTo(br.x, y); }
  ctx.stroke();
  ctx.fillStyle = '#e5534b';                     // 世界原點紅點,平移縮放時當參考
  ctx.beginPath(); ctx.arc(0, 0, 6 / camera.zoom, 0, Math.PI * 2); ctx.fill();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);            // 每幀重設變換(playground 無 HiDPI,用單位矩陣)
  ctx.clearRect(0, 0, W, H);
  ctx.save(); applyCamera(ctx, camera); drawGrid(); ctx.restore();
  // 作業要求 2:角落即時顯示滑鼠當前的世界座標(畫在畫布上,取代原作業的 DOM)
  const w = screenToWorld(mouse, camera);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(6, 6, 176, 22);
  ctx.fillStyle = '#333'; ctx.font = '13px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('world: (' + w.x.toFixed(1) + ', ' + w.y.toFixed(1) + ')', 12, 17);
  requestAnimationFrame(render);
}
