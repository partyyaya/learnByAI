<script>
window.CH = {
  chapter: '05',
  title: "像素操作與影像處理",
  md: '../05-pixel-manipulation-and-image-processing.md',
  W: 360, H: 240,
  presets: [
{ id:'invert', label:'5.1 起手式 + 反相(255 - 值)', code:
`// 像素處理起手式:畫圖 → getImageData 讀出 → 改 → putImageData 寫回
ctx.drawImage(sampleImage, 0, 0, W, H);
const img = ctx.getImageData(0, 0, W, H);   // .data = [R,G,B,A, R,G,B,A, ...]
const d = img.data;
for (let i = 0; i < d.length; i += 4) {      // 每 4 個一組 = 一個像素
  d[i]   = 255 - d[i];     // R
  d[i+1] = 255 - d[i+1];   // G
  d[i+2] = 255 - d[i+2];   // B
  // d[i+3] 是 alpha,不動
}
ctx.putImageData(img, 0, 0);` },
{ id:'grayscale', label:'5.2 灰階(人眼加權亮度)', code:
`// 灰階:用人眼加權(綠最敏感)算亮度,再把 R=G=B 都設成它
ctx.drawImage(sampleImage, 0, 0, W, H);
const img = ctx.getImageData(0, 0, W, H);
const d = img.data;
for (let i = 0; i < d.length; i += 4) {
  const y = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
  d[i] = d[i+1] = d[i+2] = y;
}
ctx.putImageData(img, 0, 0);` },
{ id:'brightness-contrast', label:'5.3 亮度 + 對比', code:
`// 對比:先減 128、乘對比、加回 128;再整體加亮度;最後夾在 0..255
const brightness = 25;   // 改改看
const contrast = 1.5;    // >1 更強烈、<1 更平淡
ctx.drawImage(sampleImage, 0, 0, W, H);
const img = ctx.getImageData(0, 0, W, H);
const d = img.data;
function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
for (let i = 0; i < d.length; i += 4) {
  for (let c = 0; c < 3; c++) {
    let v = d[i+c];
    v = (v - 128) * contrast + 128 + brightness;
    d[i+c] = clamp(v);
  }
}
ctx.putImageData(img, 0, 0);` },
{ id:'threshold', label:'5.4 二值化(threshold)', code:
`// 二值化:算亮度,超過門檻 → 白,否則 → 黑(改 threshold 看效果)
const threshold = 130;
ctx.drawImage(sampleImage, 0, 0, W, H);
const img = ctx.getImageData(0, 0, W, H);
const d = img.data;
for (let i = 0; i < d.length; i += 4) {
  const y = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
  const v = y >= threshold ? 255 : 0;
  d[i] = d[i+1] = d[i+2] = v;
}
ctx.putImageData(img, 0, 0);` },
{ id:'channel', label:'5.5 只留單一色版', code:
`// 只留紅色版:把 G、B 兩個色版歸零
ctx.drawImage(sampleImage, 0, 0, W, H);
const img = ctx.getImageData(0, 0, W, H);
const d = img.data;
for (let i = 0; i < d.length; i += 4) {
  d[i+1] = 0;   // G 歸零
  d[i+2] = 0;   // B 歸零
}
ctx.putImageData(img, 0, 0);` },
{ id:'blur', label:'5.6 卷積:3x3 模糊(用第二緩衝)', code:
`// 3x3 卷積(模糊):新像素 = 周圍 9 格平均;用另一份輸出緩衝,避免就地污染
ctx.drawImage(sampleImage, 0, 0, W, H);
const src = ctx.getImageData(0, 0, W, H);
const dst = ctx.createImageData(W, H);       // 輸出緩衝
const s = src.data, o = dst.data;
const kw = 3, half = 1, kSum = 9;
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    let r = 0, g = 0, b = 0;
    for (let ky = 0; ky < kw; ky++) {
      for (let kx = 0; kx < kw; kx++) {
        const px = Math.min(W - 1, Math.max(0, x + kx - half));
        const py = Math.min(H - 1, Math.max(0, y + ky - half));
        const idx = (py * W + px) * 4;
        r += s[idx]; g += s[idx+1]; b += s[idx+2];
      }
    }
    const oi = (y * W + x) * 4;
    o[oi] = r / kSum; o[oi+1] = g / kSum; o[oi+2] = b / kSum; o[oi+3] = 255;
  }
}
ctx.putImageData(dst, 0, 0);` },
{ id:'edge', label:'5.6 卷積:邊緣偵測(Laplacian)', code:
`// 邊緣偵測:拉普拉斯核強調鄰居差異大處 → 描出輪廓
ctx.drawImage(sampleImage, 0, 0, W, H);
const src = ctx.getImageData(0, 0, W, H);
const dst = ctx.createImageData(W, H);
const s = src.data, o = dst.data;
const k = [0, -1, 0, -1, 4, -1, 0, -1, 0];   // Laplacian kernel
const kw = 3, half = 1;
function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    let r = 0, g = 0, b = 0;
    for (let ky = 0; ky < kw; ky++) {
      for (let kx = 0; kx < kw; kx++) {
        const px = Math.min(W - 1, Math.max(0, x + kx - half));
        const py = Math.min(H - 1, Math.max(0, y + ky - half));
        const idx = (py * W + px) * 4, w = k[ky * kw + kx];
        r += s[idx] * w; g += s[idx+1] * w; b += s[idx+2] * w;
      }
    }
    const oi = (y * W + x) * 4;
    o[oi] = clamp(r); o[oi+1] = clamp(g); o[oi+2] = clamp(b); o[oi+3] = 255;
  }
}
ctx.putImageData(dst, 0, 0);` },
{ id:'homework', label:'💡 動手作業:綠幕去背', code:
`// 第 05 章作業:綠幕去背 + 合成。左=原圖(綠幕前景),右=去背後疊到背景
const SW = 320, SH = 240;
// ① 綠幕前景圖(離屏;實務換成真照片)。綠幕用漸層模擬打光不均 → 待會不能用「等於某個綠」判斷
const fg = document.createElement('canvas'); fg.width = SW; fg.height = SH;
const fgCtx = fg.getContext('2d', { willReadFrequently: true });   // 要頻繁讀像素(5.6)
const scr = fgCtx.createLinearGradient(0, 0, SW, SH);
scr.addColorStop(0, 'rgb(40,190,70)'); scr.addColorStop(1, 'rgb(20,150,50)');
fgCtx.fillStyle = scr; fgCtx.fillRect(0, 0, SW, SH);
fgCtx.fillStyle = '#f2c9a0'; fgCtx.beginPath(); fgCtx.arc(160, 80, 32, 0, Math.PI * 2); fgCtx.fill();  // 頭
fgCtx.fillStyle = '#3b5bdb'; fgCtx.fillRect(128, 116, 64, 92);                                          // 身體
fgCtx.strokeStyle = '#3b5bdb'; fgCtx.lineWidth = 16; fgCtx.lineCap = 'round';                           // 手臂
fgCtx.beginPath(); fgCtx.moveTo(130, 130); fgCtx.lineTo(92, 176); fgCtx.moveTo(190, 130); fgCtx.lineTo(228, 176); fgCtx.stroke();
// ② 背景圖(離屏;實務同樣換成照片)
const bg = document.createElement('canvas'); bg.width = SW; bg.height = SH;
const bgCtx = bg.getContext('2d');
const sky = bgCtx.createLinearGradient(0, 0, 0, SH);
sky.addColorStop(0, '#1e3a8a'); sky.addColorStop(1, '#f97316');
bgCtx.fillStyle = sky; bgCtx.fillRect(0, 0, SW, SH);
bgCtx.fillStyle = '#fde047'; bgCtx.beginPath(); bgCtx.arc(80, 150, 28, 0, Math.PI * 2); bgCtx.fill();
bgCtx.fillStyle = '#292524'; bgCtx.fillRect(0, SH - 36, SW, 36);
// 先存一份「原圖」快照(左邊要畫),因為去背會就地改掉 fg
const before = document.createElement('canvas'); before.width = SW; before.height = SH;
before.getContext('2d').drawImage(fg, 0, 0);
// ③ 去背核心:遍歷像素,把「綠明顯高於紅藍」的像素 alpha 設 0
const im = fgCtx.getImageData(0, 0, SW, SH), d = im.data;   // GPU→CPU 回讀很貴,整張只做一次
for (let i = 0; i < d.length; i += 4) {
  const r = d[i], g = d[i + 1], b = d[i + 2];
  if (g > r * 1.4 && g > b * 1.4) d[i + 3] = 0;   // 相對比較:不能用絕對門檻,否則亮膚色/白色會一起被挖掉
}
fgCtx.putImageData(im, 0, 0);                     // putImageData 直接蓋記憶體、不做 alpha 混合(5.4)
// ④ 合成:背景先畫,去背後前景用 drawImage 疊上去(尊重透明度)
const after = document.createElement('canvas'); after.width = SW; after.height = SH;
const aCtx = after.getContext('2d');
aCtx.drawImage(bg, 0, 0); aCtx.drawImage(fg, 0, 0);   // 透明像素透出背景 → 合成就是在玩 alpha
// ── 把「原圖 / 合成」兩張並排畫到 playground 這張畫布上 ──
ctx.clearRect(0, 0, W, H);
const gap = 10, halfW = (W - gap) / 2, halfH = halfW * SH / SW, y0 = (H - halfH) / 2 + 8;
ctx.drawImage(before, 0, y0, halfW, halfH);
ctx.drawImage(after, halfW + gap, y0, halfW, halfH);
ctx.fillStyle = '#333'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
ctx.fillText('原圖(綠幕前景)', halfW / 2, y0 - 4);
ctx.fillText('去背後疊到背景', halfW + gap + halfW / 2, y0 - 4);` }
  ]
};
</script>
