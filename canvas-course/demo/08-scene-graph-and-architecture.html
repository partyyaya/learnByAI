`// 場景圖:用陣列存所有圖形,render 遍歷叫每個物件畫自己
class Shape {
  constructor(p){ Object.assign(this, { x:0, y:0, rotation:0 }, p); }
  draw(ctx){}                       // 子類實作:怎麼畫自己
}
class RectShape extends Shape {
  constructor(p){ super(Object.assign({ w:100, h:64, fill:'#888' }, p)); }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x, this.y);  // 以自己為原點畫(第 03 章)
    ctx.rotate(this.rotation);
    ctx.fillStyle = this.fill;
    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
    ctx.restore();                  // 自掃門前雪,狀態不外洩
  }
}
class CircleShape extends Shape {
  constructor(p){ super(Object.assign({ r:44, fill:'#888' }, p)); }
  draw(ctx){
    ctx.save();
    ctx.fillStyle = this.fill;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
// 場景 = 一個純資料陣列(唯一真相來源)
const scene = [
  new RectShape({ x:110, y:90, fill:'#e63946' }),
  new CircleShape({ x:300, y:150, r:50, fill:'#457b9d' }),
  new RectShape({ x:210, y:205, w:150, h:52, rotation:0.3, fill:'#2a9d8f' }),
];
// render:遍歷,叫每個物件畫自己

for (const s of scene) s.draw(ctx);` },

`// 每個圖形的 draw 都用 save/restore 包住,狀態不會污染下一個
class Blob {
  constructor(p){ Object.assign(this, { r:42, fill:'#888', alpha:1, shadow:0 }, p); }
  draw(ctx){
    ctx.save();                       // 進場存檔
    ctx.globalAlpha = this.alpha;     // 只影響這一個
    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = this.shadow;     // 只影響這一個
    ctx.fillStyle = this.fill;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();                    // 離場還原:alpha/shadow 全清掉
  }
}
const scene = [
  new Blob({ x:90,  y:140, fill:'#e63946', alpha:0.35 }),  // 半透明,只有它
  new Blob({ x:200, y:140, fill:'#457b9d', shadow:22 }),   // 有陰影,只有它
  new Blob({ x:315, y:140, fill:'#2a9d8f' }),              // 乾淨:沒被前兩個污染

`// 互動:點空白處新增圓、點圓刪除它。畫面只是「資料陣列」的投影

    ctx.fill();
    ctx.restore();
  }
  containsPoint(px, py){ const dx = px-this.x, dy = py-this.y; return dx*dx + dy*dy <= this.r*this.r; }

`// 互動:拖曳畫面 → 只移動父節點,子節點座標相對父層,自動跟著動
class Node {
  constructor(p){ Object.assign(this, { x:0, y:0, rotation:0, w:0, h:0, fill:'#888' }, p); this.children = []; }
  add(c){ this.children.push(c); return this; }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x, this.y);      // 套用「自己相對父層」的變換
    ctx.rotate(this.rotation);
    if (this.w) { ctx.fillStyle = this.fill; ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h); }
    for (const c of this.children) c.draw(ctx);   // 遞迴畫子節點
    ctx.restore();                      // 還原,不洩漏給兄弟節點
  }
}
// 群組:父節點(中心小標記)+ 三個相對座標的子節點
const group = new Node({ x:200, y:140, w:14, h:14, fill:'#264653' });
group.add(new Node({ x:-72, y:-42, w:64, h:64, fill:'#e63946' }));
group.add(new Node({ x:64,  y:-24, w:74, h:52, fill:'#457b9d' }));
group.add(new Node({ x:0,   y:62,  w:92, h:42, fill:'#2a9d8f' }));
function render(){ ctx.clearRect(0, 0, W, H); group.draw(ctx); }
let drag = false, ox = 0, oy = 0;
canvas.addEventListener('mousedown', function(e){
  const r = canvas.getBoundingClientRect();
  drag = true; ox = e.clientX - r.left - group.x; oy = e.clientY - r.top - group.y;
});
canvas.addEventListener('mousemove', function(e){
  if (!drag) return;
  const r = canvas.getBoundingClientRect();
  group.x = e.clientX - r.left - ox;    // 只改父節點座標
  group.y = e.clientY - r.top - oy;     // 子節點座標原地不動,整組卻跟著移動
  render();
});
canvas.addEventListener('mouseup', function(){ drag = false; });
render();` },

  constructor(p){ Object.assign(this, { x:0, y:0, rotation:0, w:0, h:0, fill:'#888' }, p); this.children = []; }
  add(c){ this.children.push(c); return this; }

    ctx.save();
    ctx.translate(this.x, this.y);      // 累積變換:父先 translate/rotate
    ctx.rotate(this.rotation);
    if (this.w) { ctx.fillStyle = this.fill; ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h); }
    for (const c of this.children) c.draw(ctx);   // 子節點在父的基礎上再畫
    ctx.restore();
  }
}
const group = new Node({ x:200, y:140, w:14, h:14, fill:'#264653' });

function frame(){

  ctx.clearRect(0, 0, W, H);

}

{ id:'dirty-rect', label:'8.6 髒矩形:只重畫變動的區域', code:
`// 髒矩形:每幀只清除並重畫「有變動的那塊」,黃框標出髒區域
function drawBg(x, y, w, h){               // 只重繪指定區域的背景
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();   // 裁切:繪圖只落在這塊
  ctx.fillStyle = '#1d3557'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let gx = 0; gx < W; gx += 26) for (let gy = 0; gy < H; gy += 26) ctx.fillRect(gx, gy, 13, 13);
  ctx.restore();
}
drawBg(0, 0, W, H);                        // 開場:整片背景只畫這一次
const ball = { x:80, y:140, r:26, vx:2.6, vy:1.9 };
function bounds(){ return { x:ball.x-ball.r-3, y:ball.y-ball.r-3, w:ball.r*2+6, h:ball.r*2+6 }; }
let prev = bounds();                       // 記住上一幀的包圍盒
function frame(){
  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x < ball.r || ball.x > W-ball.r) ball.vx *= -1;
  if (ball.y < ball.r || ball.y > H-ball.r) ball.vy *= -1;
  const nb = bounds();
  // 髒區域 = 上一幀 ∪ 這一幀(擦掉舊位置、畫上新位置)
  const dx = Math.min(prev.x, nb.x), dy = Math.min(prev.y, nb.y);
  const dw = Math.max(prev.x+prev.w, nb.x+nb.w) - dx;
  const dh = Math.max(prev.y+prev.h, nb.y+nb.h) - dy;
  drawBg(dx, dy, dw, dh);                  // 只重畫這一小塊,不是整片畫面
  ctx.save();
  ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1;
  ctx.strokeRect(nb.x+0.5, nb.y+0.5, nb.w-1, nb.h-1);   // 標出這一幀的髒區
  ctx.restore();
  prev = nb;                               // 下一幀要負責擦掉這一幀的框
  requestAnimationFrame(frame);
}
frame();` },
{ id:'homework', label:'💡 動手作業:有場景圖的圖形編輯器', code:
`// 第 08 章作業:Shape 基類 + Rect/Circle/Text 子類,新增/選取/拖曳/刪除 + 快照式 Undo/Redo + localStorage 存檔
// 注入工具列(playground 沒有這排按鈕;離開範例會自動清掉),鍵盤:Delete 刪除 / Ctrl+Z 復原 / Ctrl+Shift+Z 重做
const stage = canvas.parentNode; stage.style.flexDirection = 'column';
const bar = document.createElement('div'); bar.className = 'demo-inject';
bar.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px;';
const mk = t => { const b = document.createElement('button'); b.textContent = t; return b; };
const bRect = mk('+ 矩形'), bCircle = mk('+ 圓形'), bText = mk('+ 文字'), bSave = mk('存檔'), bLoad = mk('載入');
const hint = document.createElement('span'); hint.style.color = '#888';
hint.textContent = '點擊選取 / 拖曳移動 / Delete 刪除 / Ctrl+Z / Ctrl+Shift+Z';
bar.append(bRect, bCircle, bText, bSave, bLoad, hint); stage.insertBefore(bar, canvas);

// ---- Shape 基類:自己知道怎麼畫、怎麼命中、怎麼變純資料 ----
class Shape {
  constructor(props) { Object.assign(this, { x: 0, y: 0, fill: '#888' }, props); }
  draw(ctx) {}
  containsPoint(p) { return false; }
  getBounds() { return { x: this.x, y: this.y, w: 0, h: 0 }; }
  toJSON() { return { type: this.constructor.name, x: this.x, y: this.y, fill: this.fill }; }   // 白名單:只存純資料
}
class RectShape extends Shape {
  constructor(props) { super(Object.assign({ w: 90, h: 56 }, props)); }
  draw(ctx) { ctx.fillStyle = this.fill; ctx.fillRect(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h); }
  containsPoint(p) { return Math.abs(p.x - this.x) <= this.w / 2 && Math.abs(p.y - this.y) <= this.h / 2; }
  getBounds() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }
  toJSON() { return Object.assign(super.toJSON(), { w: this.w, h: this.h }); }
}
class CircleShape extends Shape {
  constructor(props) { super(Object.assign({ r: 34 }, props)); }
  draw(ctx) { ctx.fillStyle = this.fill; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); }
  containsPoint(p) { const dx = p.x - this.x, dy = p.y - this.y; return dx * dx + dy * dy <= this.r * this.r; }
  getBounds() { return { x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 }; }
  toJSON() { return Object.assign(super.toJSON(), { r: this.r }); }
}
class TextShape extends Shape {
  constructor(props) { super(Object.assign({ text: '你好 Canvas', size: 24 }, props)); }
  draw(ctx) {
    ctx.fillStyle = this.fill; ctx.font = this.size + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.text, this.x, this.y);
  }
  measureWidth() { ctx.font = this.size + 'px sans-serif'; return ctx.measureText(this.text).width; }   // 量測前先設同字型
  containsPoint(p) { return Math.abs(p.x - this.x) <= this.measureWidth() / 2 && Math.abs(p.y - this.y) <= this.size / 2; }
  getBounds() { const w = this.measureWidth(); return { x: this.x - w / 2, y: this.y - this.size / 2, w: w, h: this.size }; }
  toJSON() { return Object.assign(super.toJSON(), { text: this.text, size: this.size }); }
}

// ---- 序列化(8.8):場景 → 純資料;載入用型別註冊表重建實例 ----
const SHAPE_REGISTRY = { RectShape, CircleShape, TextShape };
function serialize(scene) { return scene.map(s => s.toJSON()); }               // 回傳全新純資料,天然就是深拷貝
function deserialize(data) { return data.map(d => new SHAPE_REGISTRY[d.type](d)); }

// ---- 快照式 Undo/Redo(8.7 做法 A) ----
class History {
  constructor() { this.past = []; this.future = []; }
  commit(scene) { this.past.push(serialize(scene)); this.future = []; }        // 存快照;有新操作就清空 redo
  undo(apply) { if (this.past.length < 2) return; this.future.push(this.past.pop()); apply(this.past[this.past.length - 1]); }
  redo(apply) { if (!this.future.length) return; const s = this.future.pop(); this.past.push(s); apply(s); }
}

// ---- 編輯器狀態:場景陣列是唯一真相來源,畫面只是投影(8.3) ----
let scene = [], selected = null, dragging = null, dragOffset = { x: 0, y: 0 }, dragMoved = false;
const history = new History();
history.commit(scene);                                                         // 先存初始空場景,第一次新增才撤銷得掉
function applyState(data) { scene = deserialize(data); selected = null; invalidate(); }   // undo/redo = 重建實例再投影

let dirty = true; function invalidate() { dirty = true; }
function render() {
  ctx.clearRect(0, 0, W, H);
  for (const s of scene) s.draw(ctx);                                          // 正向遍歷:後畫的蓋上面(8.5)
  if (selected) {
    const b = selected.getBounds();
    ctx.strokeStyle = '#1d7fe0'; ctx.lineWidth = 2; ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
  }
}
function frame() { if (dirty) { render(); dirty = false; } requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---- 命中測定與拖曳(第 07 章) ----
function hitTest(p) { for (let i = scene.length - 1; i >= 0; i--) if (scene[i].containsPoint(p)) return scene[i]; return null; }
function getPointerPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
canvas.addEventListener('pointerdown', (e) => {
  const p = getPointerPos(e); selected = hitTest(p);                           // 點空白 = 取消選取
  if (selected) { dragging = selected; dragMoved = false; dragOffset = { x: p.x - selected.x, y: p.y - selected.y }; canvas.setPointerCapture(e.pointerId); }
  invalidate();
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return; const p = getPointerPos(e);
  dragging.x = p.x - dragOffset.x; dragging.y = p.y - dragOffset.y; dragMoved = true; invalidate();   // 拖曳 = 改資料
});
canvas.addEventListener('pointerup', (e) => {
  if (dragging && dragMoved) history.commit(scene);                            // 拖曳結束才存快照,不是每個 move 都存
  dragging = null; canvas.releasePointerCapture(e.pointerId);
});

// ---- 鍵盤:掛在 window,離開範例時記得移除(見下方 __demoCleanup) ----
function onKey(e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;   // 在程式碼編輯器打字時不誤觸
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    scene.splice(scene.indexOf(selected), 1); selected = null; history.commit(scene); invalidate();   // 刪除 = 移除再投影
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) history.redo(applyState); else history.undo(applyState);
  }
}
window.addEventListener('keydown', onKey);
window.__demoCleanup = () => { stage.style.flexDirection = ''; window.removeEventListener('keydown', onKey); };

// ---- 工具列:新增圖形 ----

function addShape(ShapeClass) {
  const s = new ShapeClass({ x: 70 + Math.random() * (W - 140), y: 60 + Math.random() * (H - 120), fill: COLORS[Math.floor(Math.random() * COLORS.length)] });
  scene.push(s); selected = s; history.commit(scene); invalidate();           // 新增也 commit,Ctrl+Z 才撤銷得掉
}
bRect.onclick = () => addShape(RectShape);
bCircle.onclick = () => addShape(CircleShape);
bText.onclick = () => addShape(TextShape);
