worker_processes 1;
pid /tmp/nginx.pid;
# Request error context can contain a raw URL; use the bounded access record below.
error_log /dev/stderr emerg;
events { worker_connections 256; }
http {
  server_tokens off;
  log_format safe escape=json '{"event":"proxy_response","status":$status,"durationSeconds":$request_time,"upstreamStatus":"$upstream_status","requestId":"$upstream_http_x_request_id"}';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_header_timeout 5s;
  client_body_timeout 5s;
  keepalive_timeout 5s;
  # The application's 16 KiB / JSON / encoding checks remain the error-contract boundary.
  client_max_body_size 0;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  upstream articles {
    zone articles 64k;
    server api:3000 resolve;
    keepalive 8;
  }
  server {
    listen 8080;
    server_name _;
    return 308 https://localhost:34427$request_uri;
  }
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($http_host != 'localhost:34427') { return 421; }
    location / {
      proxy_pass http://articles;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host 'localhost:34427';
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For '';
      proxy_set_header Forwarded '';
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_next_upstream off;
      proxy_connect_timeout 2s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }
  }
}
