name: nodejs-course-07

services:
  tools:
    # 固定映像內容；此映像提供 Node 24.22.1 與 npm 11.19.1。
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    working_dir: /work
    volumes:
      - .:/work
      - node_modules:/work/node_modules
    command: ["npm", "run", "check"]

  api:
    extends: tools
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      SHUTDOWN_TIMEOUT_MS: "3000"
    ports:
      - "127.0.0.1:3007:3000"
    init: true
    stop_grace_period: 8s
    command: ["node", "--enable-source-maps", "dist/main.js"]

volumes:
  node_modules:
