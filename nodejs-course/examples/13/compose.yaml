name: nodejs-course-13

services:
  tools:
    # 基底版本固定於 Dockerfile，另安裝 migration engine 所需的 OpenSSL。
    build: .
    image: nodejs-course-13-tools:local
    working_dir: /work
    volumes:
      - .:/work
      - node_modules:/work/node_modules
    environment:
      DATABASE_URL: postgresql://course:course_local@postgres:5432/course?schema=public
      TEST_DATABASE_URL: postgresql://course:course_local@test-db:5432/course_test
    command: ["npm", "run", "check"]

  api:
    extends: tools
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      SHUTDOWN_TIMEOUT_MS: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3013:3000"
    init: true
    stop_grace_period: 8s
    command: ["node", "--enable-source-maps", "dist/main.js"]

  postgres:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course
    ports:
      - "127.0.0.1:15413:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 2s
      timeout: 2s
      retries: 20

  test-db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course_test"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
  node_modules:
