name: nodejs-course-33

services:
  tools:
    # 基底版本固定於 Dockerfile，另安裝 migration engine 所需的 OpenSSL。
    build:
      context: .
      target: tools
    image: nodejs-course-33-tools:local
    working_dir: /work
    volumes:
      - .:/work
      - node_modules:/work/node_modules
    environment:
      APP_ORIGIN: http://127.0.0.1:3033
      DEMO_AUTH_SEED: "1"
      DATABASE_URL: postgresql://course:course_local@postgres:5432/course?schema=public
      TEST_DATABASE_URL: postgresql://course:course_local@test-db:5432/course_test
    command: ["npm", "run", "check"]

  api:
    extends: tools
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      SHUTDOWN_TIMEOUT_MS: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3033:3000"
    init: true
    stop_grace_period: 8s
    command: ["node", "--enable-source-maps", "dist/fastify-main.js"]

  upstream:
    extends: tools
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
    ports:
      - "127.0.0.1:3233:4000"
    init: true
    command: ["node", "dist/reference-upstream.js"]

  external-lab:
    extends: tools
    environment:
      HOST: 0.0.0.0
      PORT: "3133"
      REFERENCE_ORIGIN: http://upstream:4000
    depends_on:
      - upstream
    ports:
      - "127.0.0.1:3133:3133"
    init: true
    stop_grace_period: 8s
    command: ["node", "dist/external-lab.js"]

  performance-lab:
    extends: tools
    environment:
      HOST: 0.0.0.0
      PORT: "3333"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:3333"
    init: true
    stop_grace_period: 8s
    command: ["node", "dist/performance-lab.js"]

  browser-tests:
    extends: tools
    build:
      context: .
      target: browser
    image: nodejs-course-33-browser:local
    shm_size: 256m
    init: true
    command: ["npm", "run", "test:browser"]

  cors-lab:
    extends: tools
    ports: ["127.0.0.1:4033:4033"]
    command: ["node", "dist/cors-lab.js"]

  postgres:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 2s
      timeout: 2s
      retries: 20

  test-db:
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course_local
      POSTGRES_DB: course_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course_test"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
  node_modules:

