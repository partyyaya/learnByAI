<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章工作台</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<header><p>Node.js 課程</p><h1>文章工作台</h1><p id="identity">載入中…</p><button id="logout" hidden>登出</button></header>
<main><p id="message" role="status" aria-live="polite"></p>
<section id="auth"><h2>登入或註冊</h2><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><label>顯示名稱（註冊用）<input id="display-name" autocomplete="nickname" value="讀者"></label><button id="login" type="submit">登入</button><button id="register" type="button">註冊</button></form><p>註冊後不會自動登入。密碼不保存於網頁儲存空間。</p></section>
<section><h2>公開文章</h2><form id="search-form"><label>搜尋標題<input id="search" maxlength="80"></label><button>查詢</button></form><button id="refresh-public">重新載入</button><p id="public-state"></p><ul id="public-list"></ul></section>
<section id="workspace" hidden><h2>我的文章</h2><button id="refresh-own">重新載入本人列表</button><ul id="own-list"></ul><h3 id="editor-state">建立新草稿</h3><form id="editor"><label>標題<input id="title" required></label><label>正文<textarea id="content" required></textarea></label><button id="save">建立草稿</button><button id="new" type="button">清空並新增</button></form><p>版本衝突時保留輸入，不自動覆寫或重送。</p></section>
<section id="comments-panel" hidden><h2 id="comments-title">留言</h2><ul id="comments-list"></ul><form id="comment-form" hidden><label>留言（最多 1000 code points）<textarea id="comment-content" required></textarea></label><button id="comment-save">新增留言</button></form></section>
<section id="admin-panel" hidden><h2>管理員狀態稽核</h2><form id="audit-form"><label>文章 ID<input id="audit-article" required></label><button id="audit-load">查詢稽核</button></form><pre id="audit-result"></pre></section></main><footer>公開端點僅顯示已發佈文章；畫面按鈕不是授權邊界。</footer></body></html>
